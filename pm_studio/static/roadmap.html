       `closed` above counts the history rows - closed AND settled, folded away. A closed
       project still holding outstanding work is NOT folded (see isHistoryRow), so it is
       counted among this section's projects while wearing a "closed" chip, which reads as
       a contradiction until something names it. This is that something: it says out loud
       that N rows below are closed and still have work in them, which is the whole reason
       they are above the fold rather than behind it.

       `ready to close` is the other direction - open rows whose work is all settled. Both
       belong in the heading because a folded section shows nothing else, and both are
       piles somebody is supposed to empty. */
    const stranded = currentRows.filter(
      (r) => r.project && r.project.status === "closed").length;
    if (stranded) {
      tally.appendChild(el("span", "warn-count",
        `${stranded} closed with work left`));
    }
    const ready = currentRows.filter(
      (r) => r.project && closeCandidate(r.project.id)
        && closeCandidate(r.project.id).reason !== "blocked").length;
    if (ready) tally.appendChild(el("span", "ready-count", `${ready} ready to close`));
    if (suggestions.length) tally.appendChild(el("span", null, `${suggestions.length} to triage`));
    if (subgroups.length) {
      // Counted separately from the section's own numbers rather than folded into them:
      // "4 open" that silently included three sub-products' work would misreport what
      // this board is running, and the whole point of the nesting is that both are true
      // at once. Folded shut, this is what says the family is not empty.
      const nested = groupDescendants(group);
      const nestedOpen = subgroups
        .flatMap(groupChanges)
        .filter(isOutstanding).length;
      tally.appendChild(el("span", "nested",
        `+${nestedOpen} open in ${nested.length} sub-product${nested.length === 1 ? "" : "s"}`));
    }
    head.appendChild(tally);

    section.appendChild(head);
    // Outside group-body on purpose: a folded section shows only its heading, and the
    // description should be readable without unfolding the whole board underneath it.
    if (group.description && revealDesc.has(group.key)) {
      section.appendChild(el("div", "group-desc", group.description));
    }

    /* Everything below the heading, built the first time the section is opened. The
       tally above is what a folded section says about its contents, and it is computed
       from the data - so a folded section never needs the rows themselves, which are by
       far the most expensive thing on this page (see buildOnce). */
    const body = el("div", "group-body");
    const fillBody = buildOnce(() => {
      if (suggestions.length) {
        const triage = el("div", "triage");
        for (const item of suggestions) triage.appendChild(suggestionCard(item));
        body.appendChild(triage);
      }
      if (subgroups.length) {
        // The Show filter reaches in here too: an active parent does not exempt its
        // dormant children. What it hides it counts, in place, so the family a heading
        // promised ("+N open in M sub-products") never just silently shrinks.
        const shownSubs = subgroups.filter(groupVisible);
        if (shownSubs.length) {
          const nested = el("div", "subgroups");
          for (const sub of shownSubs) nested.appendChild(groupSection(sub, depth + 1));
          body.appendChild(nested);
        }
        if (shownSubs.length < subgroups.length) {
          const n = subgroups.length - shownSubs.length;
          body.appendChild(el("div", "filter-note",
            `${n} sub-product${n === 1 ? "" : "s"} hidden by the ${searchActive() ? "search or the " : ""}Show filter.`));
        }
      }
      if (rows.length) {
        const list = el("div", "projects");
        for (const row of currentRows) list.appendChild(projectNode(row));
        if (closedRows.length) {
          const shown = revealClosed.has(group.key);
          const toggle = el("button", "closed-toggle");
          toggle.type = "button";
          toggle.setAttribute("aria-expanded", String(shown));
          toggle.appendChild(el("span", "twisty", shown ? "▾" : "▸"));
          toggle.appendChild(document.createTextNode(
            `${shown ? "Hide" : "Show"} ${closedRows.length} closed project${closedRows.length === 1 ? "" : "s"}`));
          toggle.addEventListener("click", () => {
            if (shown) revealClosed.delete(group.key); else revealClosed.add(group.key);
            renderAll();
          });
          list.appendChild(toggle);
          if (shown) for (const row of closedRows) list.appendChild(projectNode(row));
        }
        body.appendChild(list);
      } else if (!suggestions.length && !subgroups.length) {
        // Said only when there is genuinely nothing here. A parent whose work all lives in
        // its sub-products is not empty, and the sections below say so themselves.
        body.appendChild(el("div", "project-empty", "No projects or changes here yet."));
      }
    });

    head.addEventListener("click", () => {
      const nowCollapsed = !section.classList.contains("collapsed");
      // Filled while it is still hidden, so opening costs one layout rather than two.
      if (!nowCollapsed) fillBody();
      section.classList.toggle("collapsed", nowCollapsed);
      if (nowCollapsed) expanded.delete(group.key); else expanded.add(group.key);
      head.setAttribute("aria-expanded", String(!nowCollapsed));
      persistExpanded();
      // The nav's collapse-all label is a function of every section's state - and the
      // only part of the nav a fold can change, so it is the only part redrawn.
      if (collapseControl) collapseControl();
    });

    section.appendChild(body);
    if (!isCollapsed(group.key)) fillBody();
    return section;
  }

  function renderBoard() {
    const groups = currentGroups();
    let drewAny = false;
    for (const group of groups) {
      if (groupVisible(group)) { board.appendChild(groupSection(group, 0)); drewAny = true; }
    }
    // A search that matched nothing says so in words, in place of the hidden-note's
    // per-state tallies - "which filter took my board" has one answer here.
    if (!drewAny && searchActive()) {
      board.appendChild(searchEmptyNote());
      return;
    }
    const note = hiddenNote(groups, "filter-note");
    if (note) board.appendChild(note);
  }

  function searchEmptyNote() {
    return el("p", "lens-empty",
      `No titles or ticket keys match “${searchQuery.trim()}” — clear the search in the nav to see the whole board.`);
  }

  /* ---- the timeline view ----------------------------------------------------------

     A change may carry real dates (`start_at` / `target_at`) and may not - both are
     optional, on purpose, because the board's own unit of planning is the Now / Next /
     Later horizon and a change nobody has committed to a date for is a normal change,
     not an incomplete one. So a bar is drawn from whichever is available, and SAYS
     WHICH:

       solid    the span is real - dates the change carries, or, for a shipped change,
                the history it actually has.
       hatched  the span is derived from the horizon: "planned for roughly here". It
                must never be mistaken for a commitment.

     A diamond marks the target date. On a shipped change it stays put, so the gap
     between the end of the bar and the diamond is the slip, filled when it shipped on
     time and red when it did not. A dotted tail before a bar is how long the change has
     been sitting on the board before its span opens - the one thing a lane view cannot
     show at all. */

  function startOfQuarter(date) {
    return new Date(date.getFullYear(), Math.floor(date.getMonth() / 3) * 3, 1);
  }
  function addMonths(date, n) {
    return new Date(date.getFullYear(), date.getMonth() + n, 1);
  }

  function axis() {
    const q0 = startOfQuarter(new Date());
    // One quarter of history, then the three horizons: Now is this quarter, Next the
    // one after, Later the two beyond that. Fifteen months, which fits without
    // scrolling on a normal window and keeps a month column readable.
    return {
      start: +addMonths(q0, -3),
      end: +addMonths(q0, 12),
      bands: {
        now: [+q0, +addMonths(q0, 3)],
        next: [+addMonths(q0, 3), +addMonths(q0, 6)],
        later: [+addMonths(q0, 6), +addMonths(q0, 12)],
      },
    };
  }

  function barFor(item, ax) {
    const band = ax.bands[item.bucket] || ax.bands.later;
    const raised = item.created_at * 1000;
    const start = dateMs(item.start_at);
    const target = endOfDayMs(item.target_at);
    const lines = [];

    if (item.start_at) lines.push(`starts ${dateLabel(item.start_at)}`);
    if (item.target_at) lines.push(`target ${dateLabel(item.target_at)}`);

    if (item.status === "done") {
      const shipped = (item.shipped_at ?? item.updated_at) * 1000;
      // A shipped change is history, so the bar is measured, not planned: from when
      // work began (its own start date if it has one) to when it actually shipped.
      const from = Math.min(start ?? raised, shipped);
      if (target != null) {
        const slip = daysBetween(target, shipped);
        lines.push(slip > 0 ? `shipped ${slip}d after target` : "shipped on or before target");
      }
      return {
        start: from, end: shipped, status: "done", derived: false, tail: null, target,
        targetMet: target == null ? null : shipped <= target,
        note: [`shipped ${shortDate(shipped)}`, ...lines].join(" · "),
      };
    }

    /* Open change. Four shapes, because the missing edge has to be derived from
       something and the horizon is only the right answer when there is no date at all:

         both dates   the committed span, exactly as given.
         target only  from today to the target - "from now until due". The horizon is
                      NOT used for the left edge here: a change bucketed "next" but due
                      in three weeks would get a bar starting after it was meant to
                      finish, and the date is the sharper of the two claims.
         start only   from the start out to the end of its horizon, open-ended.
         neither      the horizon band, hatched, claiming nothing more.

       `derived` is true only in the last case - a bar with one committed edge is a
       commitment, and shading it like a guess would undersell it. */
    const today = todayMs();
    const overdue = !!item.is_overdue;
    let from, to, derived = false;
    if (start != null && target != null) {
      [from, to] = [start, target];
    } else if (target != null) {
      [from, to] = [Math.min(today, target), target];
    } else if (start != null) {
      [from, to] = [start, Math.max(band[1], today)];
    } else {
      [from, to] = [band[0], band[1]];
      derived = true;
    }
    // An overdue change keeps running to today, so the overrun past its diamond is the
    // length of the bar rather than something you have to read off the axis.
    if (overdue) to = Math.max(to, today + 86400000);

    if (derived) {
      lines.push(`${item.bucket} horizon (${shortDate(band[0])} – ${shortDate(band[1] - 1)})`);
    } else if (overdue) {
      lines.push(`OVERDUE by ${daysBetween(dateMs(item.target_at), today)}d`);
    } else if (target != null) {
      const left = daysBetween(today, dateMs(item.target_at));
      lines.push(left === 0 ? "due today" : `${left}d left`);
    }

    return {
      start: from,
      end: to,
      status: overdue ? "overdue" : item.status,
      derived,
      // Only worth drawing when the change predates the span it is waiting on.
      tail: raised < from ? [raised, from] : null,
      target,
      targetMet: null,
      note: [STATUS_LABEL[item.status], ...lines.filter(Boolean),
             `on the board since ${shortDate(raised)}`].join(" · "),
    };
  }

  function renderTimeline() {
    // Before any chrome is drawn: a legend and an axis over zero rows would read as a
    // broken chart, where the lane view's equivalent is simply an empty page.
    if (searchActive() && !flatGroups().length) {
      board.appendChild(searchEmptyNote());
      return;
    }
    const ax = axis();
    const span = ax.end - ax.start;
    const pct = (t) => ((t - ax.start) / span) * 100;
    const clamp = (p) => Math.max(0, Math.min(100, p));

    // Says plainly which bars are dates and which are derived bands - the difference
    // between a commitment and a horizon is the one thing this view must not blur.
    const legend = el("div", "gantt-legend");
    const key = (swatch, text) => {
      const node = el("span", "key");
      node.appendChild(el("span", "swatch " + swatch));
      node.appendChild(el("span", null, text));
      legend.appendChild(node);
    };
    key("gantt-bar s-pending", "scheduled");
    key("gantt-bar s-in_progress", "in progress");
    key("gantt-bar s-done", "shipped");
    key("gantt-bar s-overdue", "overdue");
    key("gantt-bar s-pending derived", "no dates — horizon only");
    key("gantt-summary s-pending", "project — dated span");
    key("gantt-reach s-pending", "project — full reach");
    key("gantt-target", "target date");
    key("gantt-age", "waiting on the board");
    key("today", "today");
    board.appendChild(legend);

    const scroll = el("div", "gantt-scroll");
    const gantt = el("div", "gantt");

    // Months and quarters, positioned from real timestamps rather than as equal cells -
    // February is not the same width in time as March.
    const months = [];
    for (let d = new Date(ax.start); +d < ax.end; d = addMonths(d, 1)) months.push(new Date(d));

    const head = el("div", "gantt-head");
    head.appendChild(el("div"));

    const scale = el("div", "gantt-scale");
    for (const month of months) {
      const left = pct(+month);
      const width = pct(+addMonths(month, 1)) - left;
      if (month.getMonth() % 3 === 0) {
        const q = el("div", "gantt-quarter",
          `Q${Math.floor(month.getMonth() / 3) + 1} ${month.getFullYear()}`);
        q.style.left = left + "%";
        q.style.width = (width * 3) + "%";
        if (+month === +startOfQuarter(new Date())) q.classList.add("is-current");
        scale.appendChild(q);
      }
      const m = el("div", "gantt-month",
        month.toLocaleDateString(undefined, { month: "short" }));
      m.style.left = left + "%";
      m.style.width = width + "%";
      scale.appendChild(m);
    }
    const todayHead = el("div", "gantt-today head");
    todayHead.style.left = clamp(pct(Date.now())) + "%";
    scale.appendChild(todayHead);
    head.appendChild(scale);
    gantt.appendChild(head);

    const body = el("div", "gantt-body");
    const lines = el("div", "gantt-lines");
    lines.setAttribute("aria-hidden", "true");
    for (const month of months) {
      const line = el("div", month.getMonth() % 3 === 0 ? "q" : "m");
      line.style.left = pct(+month) + "%";
      lines.appendChild(line);
    }
    const today = el("div", "gantt-today");
    today.style.left = clamp(pct(Date.now())) + "%";
    lines.appendChild(today);
    body.appendChild(lines);

    // One change, as a row on the axis. Unchanged from before the project level
    // existed - it just no longer sits directly under a section.
    function changeRow(item, bar, omit) {
      const row = el("div", "gantt-row is-change");

      const label = el("button", "gantt-label");
      label.type = "button";
      label.setAttribute("aria-expanded", String(openCards.has(item.id)));
      const dot = el("span", `status-dot ${item.status}`);
      dot.title = STATUS_LABEL[item.status];
      label.appendChild(dot);
      label.appendChild(el("span", "name", item.title));
      if (!omit.product) label.appendChild(el("span", "sub", productPathLabel(item.product)));
      else if (item.ticket) label.appendChild(el("span", "sub", item.ticket.key));
      label.title = `${item.title}\n${bar.note}`;
      row.appendChild(label);

      const track = el("div", "gantt-track");
      if (bar.tail) {
        const tail = el("div", "gantt-age");
        const left = clamp(pct(bar.tail[0]));
        tail.style.left = left + "%";
        tail.style.width = Math.max(0, clamp(pct(bar.tail[1])) - left) + "%";
        track.appendChild(tail);
      }
      const rect = el("div", `gantt-bar s-${bar.status}` + (bar.derived ? " derived" : ""));
      const left = clamp(pct(bar.start));
      rect.style.left = left + "%";
      rect.style.width = Math.max(0.4, clamp(pct(bar.end)) - left) + "%";
      if (bar.start < ax.start) rect.classList.add("clip-start");
      if (bar.end > ax.end) rect.classList.add("clip-end");
      rect.title = bar.note;
      track.appendChild(rect);

      // Drawn even when it coincides with the bar's own right edge: on an open change
      // that is the same information twice, but on a shipped one it is the only way
      // to see that the bar stopped somewhere else.
      if (bar.target != null && bar.target > ax.start && bar.target < ax.end) {
        const mark = el("div", "gantt-target"
          + (bar.targetMet === true ? " met" : "")
          + (bar.targetMet === false || bar.status === "overdue" ? " missed" : ""));
        mark.style.left = clamp(pct(bar.target)) + "%";
        mark.title = `Target ${dateLabel(item.target_at)}`;
        track.appendChild(mark);
      }
      row.appendChild(track);

      /* The same controls the lane view's card opens, in the same place: a row that
         can be read but not changed would send you back to the other view to act - and
         built on first open for the same reason the card's are (see buildOnce). The bar
         itself stays eager: it is what this view is for, and it is cheap. */
      const detail = el("div", "gantt-detail");
      detail.hidden = !openCards.has(item.id);
      const fillDetail = buildOnce(() => {
        if (item.description) detail.appendChild(el("div", "desc", item.description));
        const chips = el("div", "card-meta");
        for (const node of metaChips(item, omit)) chips.appendChild(node);
        const timelineTicket = itemTicketNode(item, false);
        if (timelineTicket) chips.appendChild(timelineTicket);
        detail.appendChild(chips);
        detail.appendChild(itemControls(item));
      });
      row.appendChild(detail);
      if (openCards.has(item.id)) fillDetail();

      label.addEventListener("click", () => {
        const nowOpen = !openCards.has(item.id);
        if (nowOpen) { openCards.add(item.id); fillDetail(); } else openCards.delete(item.id);
        detail.hidden = !nowOpen;
        label.setAttribute("aria-expanded", String(nowOpen));
      });

      return row;
    }

    /* The project's own row, in two marks that say two different things:

         reach  where the project extends to once its undated changes are counted -
                the full envelope, as a dashed rule.
         span   the part of that backed by dates changes actually carry, as a solid
                capped bar. Absent when nothing in the project is dated.

       Its colour is the worst state underneath it, because at this altitude the
       question is "is this project in trouble", not "which of these nine changes is". */
    function summaryBar(bars) {
      const dated = bars.filter((b) => !b.derived);
      const status = bars.some((b) => b.status === "overdue")
        ? "overdue"
        : bars.some((b) => b.status === "in_progress")
        ? "in_progress"
        : bars.every((b) => b.status === "done")
        ? "done"
        : "pending";
      return {
        from: Math.min(...bars.map((b) => b.start)),
        to: Math.max(...bars.map((b) => b.end)),
        span: dated.length
          ? { from: Math.min(...dated.map((b) => b.start)), to: Math.max(...dated.map((b) => b.end)) }
          : null,
        undated: bars.length - dated.length,
        status,
      };
    }

    // Flat with depth, not nested: this view's whole point is one shared axis, so a
    // sub-product is an indented heading in the same column of rows rather than a box.
    for (const { group, depth } of flatGroups()) {
      const isFolded = isCollapsed(group.key);
      const header = el("button", "gantt-group" + (isFolded ? " collapsed" : "") + (depth ? " sub" : ""));
      if (depth) {
        // One step per level, set here rather than in CSS: the gutter is a fixed width the
        // rows share, so each level has to take its indent out of that same width instead
        // of pushing the axis along. A depth-N selector per level would be the alternative.
        const indent = depth * 13;
        header.style.marginLeft = `${indent}px`;
        header.style.width = `calc(var(--gutter) - ${indent}px)`;
      }
      header.type = "button";
      header.setAttribute("aria-expanded", String(!isFolded));
      const headLine = el("div", "head-line");
      headLine.appendChild(el("span", "chevron", "▾"));
      headLine.appendChild(kindIcon(groupKind(group, depth)));
      headLine.appendChild(el("h2", null, group.title));
      headLine.appendChild(stateIcon(groupState(group)));
      header.appendChild(headLine);
      const tally = el("div", "tally");
      // Same flags the lane view puts on a section head - "no initiative" or "closed"
      // must not be information you can only get by switching views.
      for (const [text, warn] of group.flags) tally.appendChild(chip(text, warn ? "warn" : null));
      const allRows = projectRows(group, group.changes);
      const rows = allRows.filter((r) => !isHistoryRow(r));
      const closedRows = allRows.filter(isHistoryRow);
      const open = group.changes.filter(isOutstanding).length;
      tally.appendChild(el("span", null,
        `${rows.length} project${rows.length === 1 ? "" : "s"} · ` +
        (closedRows.length ? `${closedRows.length} closed · ` : "") +
        `${group.changes.length} change${group.changes.length === 1 ? "" : "s"} · ${open} open`));
      // Folded, a parent's own heading is all that is left of its family, so it has to
      // say the sub-products exist - open, they say it themselves as their own headings.
      const subgroups = group.subgroups || [];
      if (subgroups.length && isFolded) {
        const nested = groupDescendants(group);
        const nestedOpen = subgroups.flatMap(groupChanges).filter(isOutstanding).length;
        tally.appendChild(el("span", "nested",
          `+${nestedOpen} open in ${nested.length} sub-product${nested.length === 1 ? "" : "s"}`));
      }
      header.appendChild(tally);
      // A full re-render, unlike the project twisty: folding a section removes a
      // variable number of rows, and rebuilding is simpler than tracking them all.
      header.addEventListener("click", () => {
        if (isFolded) expanded.add(group.key); else expanded.delete(group.key);
        persistExpanded();
        renderAll();
      });
      body.appendChild(header);

      if (isFolded) continue;

      if (!rows.length && !closedRows.length) {
        // A parent that runs nothing directly is not empty - its sub-products' headings
        // come next, so saying "no changes" under it would contradict them.
        if (!subgroups.length) body.appendChild(el("div", "gantt-empty", "No changes."));
        continue;
      }

      // History last, and only when asked for - the same fold the lane view offers,
      // sharing its revealClosed set so switching views doesn't re-hide what you opened.
      const showClosed = revealClosed.has(group.key);
      const drawnRows = showClosed ? rows.concat(closedRows) : rows;

      for (const projectRow of drawnRows) {
        // Everything on one axis, but out-of-range history would add rows that draw
        // nothing - so it is counted instead of listed.
        const drawn = [];
        let earlier = 0;
        for (const item of projectRow.changes) {
          const bar = barFor(item, ax);
          if (bar.end <= ax.start) { earlier++; continue; }
          drawn.push({ item, bar });
        }
        drawn.sort((a, b) =>
          (a.item.status === "done") - (b.item.status === "done")
          || (BUCKET_RANK[a.item.bucket] ?? 3) - (BUCKET_RANK[b.item.bucket] ?? 3)
          || a.bar.start - b.bar.start);

        // Open while a search is on, mirroring the lane view's projectNode.
        const isOpen = searchActive() || openProjects.has(projectRow.key);
        const head = el("div", "gantt-row is-project");

        const label = el("button", "gantt-label");
        label.type = "button";
        label.setAttribute("aria-expanded", String(isOpen));
        label.appendChild(el("span", "twisty" + (isOpen ? "" : " closed"), "▾"));
        label.appendChild(kindIcon(projectRow.project ? "project" : "loose"));
        label.appendChild(el("span", "name", projectRow.title));
        const roll = projectRow.roll;
        label.appendChild(el("span", "count", `${roll.done}/${roll.total}`));
        label.appendChild(meter(roll));
        /* No epic badge here, unlike the lane view's project head: the gantt label
           column is too narrow to give the badge room without truncating the name it
           exists to identify. The link still reads from the tooltip, and the lane view
           and portfolio page carry the visible affordances. */
        const epicNote = projectRow.project && TRACKERS.configured
          ? (projectRow.project.ticket
              ? `\ntracked as ${projectRow.project.ticket.raw_type || "Epic"} ${projectRow.project.ticket.key}`
              : (projectRow.project.is_catch_all || projectRow.project.catch_all_for_initiative
                  ? "" : "\nnot in the tracker yet — created locally, pending upload"))
          : "";
        label.title =
          `${projectRow.title} — ${roll.total} change${roll.total === 1 ? "" : "s"}, ` +
          `${roll.done} shipped, ${roll.live} in progress` +
          (roll.overdue ? `, ${roll.overdue} overdue` : "") +
          (earlier ? `\n${earlier} shipped before ${shortDate(ax.start)}` : "") +
          epicNote;
        head.appendChild(label);

        const track = el("div", "gantt-track");
        if (drawn.length) {
          const sum = summaryBar(drawn.map((d) => d.bar));
          const note = `${projectRow.title}\n` +
            (sum.span
              ? `dated ${shortDate(sum.span.from)} – ${shortDate(sum.span.to)}`
              : "nothing dated — horizon only") +
            (sum.undated ? `\nreaches ${shortDate(sum.to)} with ${sum.undated} undated change${sum.undated === 1 ? "" : "s"}` : "");

          const reach = el("div", `gantt-reach s-${sum.status}`);
          const reachLeft = clamp(pct(sum.from));
          reach.style.left = reachLeft + "%";
          reach.style.width = Math.max(0.4, clamp(pct(sum.to)) - reachLeft) + "%";
          reach.title = note;
          track.appendChild(reach);

          if (sum.span) {
            const rect = el("div", `gantt-summary s-${sum.status}`);
            const left = clamp(pct(sum.span.from));
            rect.style.left = left + "%";
            rect.style.width = Math.max(0.4, clamp(pct(sum.span.to)) - left) + "%";
            rect.title = note;
            track.appendChild(rect);
          }
        }
        head.appendChild(track);
        body.appendChild(head);

        /* The change rows this project would draw, built the first time it is twisted
           open. This view is flat - every row is a sibling in one body, so they cannot
           be nested inside the project's own row and hidden with it - which is why a
           folded project used to build them anyway and hide each one. `head.after`
           puts them back in exactly that place whenever they are built, however many
           sections have been appended after it since. */
        let childRows = [];
        let note = null;
        const fillRows = buildOnce(() => {
          childRows = drawn.map(({ item, bar }) => changeRow(item, bar, projectRow.omit));
          note = earlier
            ? el("div", "gantt-empty", `+ ${earlier} shipped before ${shortDate(ax.start)}.`)
            : !drawn.length
            ? el("div", "gantt-empty", "Nothing in range.")
            : null;
          head.after(...childRows, ...(note ? [note] : []));
        });
        if (isOpen) fillRows();

        label.addEventListener("click", () => {
          const nowOpen = !openProjects.has(projectRow.key);
          if (nowOpen) { openProjects.add(projectRow.key); fillRows(); }
          else openProjects.delete(projectRow.key);
          for (const node of childRows) node.hidden = !nowOpen;
          if (note) note.hidden = !nowOpen;
          label.firstChild.classList.toggle("closed", !nowOpen);
          label.setAttribute("aria-expanded", String(nowOpen));
          persistOpenProjects();
        });
      }

      if (closedRows.length) {
        const toggle = el("button", "closed-toggle");
        toggle.type = "button";
        toggle.setAttribute("aria-expanded", String(showClosed));
        toggle.appendChild(el("span", "twisty", showClosed ? "▾" : "▸"));
        toggle.appendChild(document.createTextNode(
          `${showClosed ? "Hide" : "Show"} ${closedRows.length} closed project${closedRows.length === 1 ? "" : "s"}`));
        // A full re-render like the section fold above it: the closed rows are a
        // variable number of gantt rows, and rebuilding is simpler than tracking them.
        toggle.addEventListener("click", () => {
          if (showClosed) revealClosed.delete(group.key); else revealClosed.add(group.key);
          renderAll();
        });
        body.appendChild(toggle);
      }
    }

    const note = hiddenNote(currentGroups(), "gantt-empty filter-note");
    if (note) body.appendChild(note);

    gantt.appendChild(body);
    scroll.appendChild(gantt);
    board.appendChild(scroll);
  }

  // ---- render ----

  /* The restructure banner: a count, and the page that fixes it. Deliberately a pointer
     rather than a second copy of the attribute-each-one controls - those live on the cards
     (itemControls) and on the systems page, and a third place to do the same write would
     be a third place to keep in step. Absent entirely once nothing is unattributed. */
  function renderUnattributedBar() {
    const bar = document.getElementById("unattributed-bar");
    bar.textContent = "";
    const count = systemsDeclared() ? (UNATTRIBUTED.count || 0) : 0;
    bar.className = count ? "visible" : "";
    if (!count) return;
    bar.appendChild(el("span", null,
      `${count} change${count === 1 ? "" : "s"} not yet attributed to a system`));
    const link = el("a", null, "Review on the systems page →");
    link.href = "/systems";
    bar.appendChild(link);
  }

  /* ---- the load table -------------------------------------------------------------

     The assignment decision, in one table: how much each person is carrying, how much of
     it is imminent, how much is late, and WHERE it is - because "who has room" and "who
     knows this area" are two questions and handing somebody work needs both answers.

     Derived from the person sections rather than fetched, so it cannot contradict the
     cards below it - see the PEOPLE comment at the top. Zero-load active people are added
     back afterwards: they have no section (nothing to draw) and they are the single most
     useful row here. */
  function loadRows(groups) {
    const rows = groups
      .filter((g) => g.key !== "person:none")
      .map((group) => {
        const open = group.changes.filter(isOutstanding);
        const spread = (pick) => {
          const counts = new Map();
          for (const change of open) {
            for (const value of pick(change)) {
              if (value) counts.set(value, (counts.get(value) || 0) + 1);
            }
          }
          return [...counts.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(b[0]));
        };
        return {
          id: group.key.slice("person:".length),
          name: group.title,
          open: open.length,
          now: open.filter((c) => c.bucket === "now").length,
          next: open.filter((c) => c.bucket === "next").length,
          later: open.filter((c) => c.bucket === "later").length,
          live: open.filter((c) => c.status === "in_progress").length,
          overdue: open.filter((c) => c.is_overdue).length,
          shipped: group.changes.length - open.length,
          products: spread((c) => [c.product]),
          // The tracker's own taxonomy - Jira components, ADO area paths. This is the
          // "area of work" half of the decision, and it is the tracker's word for it
          // rather than one invented here.
          areas: spread((c) => (c.ticket && c.ticket.components) || []),
        };
      });
    const seen = new Set(rows.map((r) => r.id));
    for (const person of PEOPLE) {
      if (seen.has(person.id) || person.status !== "active") continue;
      rows.push({
        id: person.id, name: person.name, open: 0, now: 0, next: 0, later: 0,
        live: 0, overdue: 0, shipped: 0, products: [], areas: [],
      });
    }
    // Same order as the sections - heaviest first - with the free people at the bottom,
    // which is where somebody scanning for capacity ends up looking.
    rows.sort((a, b) => b.open - a.open || b.now - a.now || a.name.localeCompare(b.name));
    return rows;
  }

  function renderLoadTable(groups) {
    const rows = loadRows(groups);
    const wrap = el("section", "load");
    const head = el("div", "load-head");
    head.appendChild(el("h2", null, "Load"));
    const nobody = groups.find((g) => g.key === "person:none");
    const unassigned = nobody ? nobody.changes.filter(isOutstanding) : [];
    // Stated up front rather than left to be noticed at the bottom of the board: work
    // nobody is on is the pile this table exists to help empty.
    head.appendChild(el("span", "load-note", unassigned.length
      ? `${unassigned.length} open change${unassigned.length === 1 ? "" : "s"} nobody is on`
      + (unassigned.filter((c) => c.bucket === "now").length
        ? ` — ${unassigned.filter((c) => c.bucket === "now").length} of them in Now`
        : "")
      : "Everything open has somebody on it."));
    wrap.appendChild(head);
    if (!rows.length) {
      wrap.appendChild(el("p", "lens-empty", TRACKERS.configured
        ? "Nobody is in the directory yet — the next tracker sync fills it in from the "
          + "assignees on your tickets."
        : "Nobody is in the directory yet — add people on the People page, then assign "
          + "changes from their cards."));
      return wrap;
    }
    const table = el("table", "load-table");
    const thead = el("thead");
    const hrow = el("tr");
    for (const [label, hint] of [
      ["Person", ""],
      ["Open", "Open changes assigned to them"],
      ["Now", "Open changes in the Now horizon — what they are meant to be on"],
      ["Next", "Queued behind Now"],
      ["Later", "Parked"],
      ["In progress", "Open changes they have actually started"],
      ["Late", "Past their target date"],
      ["Areas", "Where the work sits — products, and the components or area paths the tracker puts it in"],
    ]) {
      const cell = el("th", null, label);
      if (hint) cell.title = hint;
      hrow.appendChild(cell);
    }
    thead.appendChild(hrow);
    table.appendChild(thead);
    const body = el("tbody");
    for (const row of rows) {
      const tr = el("tr", row.open ? null : "idle");
      const name = el("td", "load-name");
      name.appendChild(el("span", null, row.name));
      if (row.shipped) {
        const shipped = el("span", "load-shipped", `${row.shipped} shipped`);
        shipped.title = "Already done — counted separately, because finished work is not load";
        name.appendChild(shipped);
      }
      tr.appendChild(name);
      for (const value of [row.open, row.now, row.next, row.later, row.live]) {
        tr.appendChild(el("td", "num", String(value)));
      }
      tr.appendChild(el("td", "num" + (row.overdue ? " late" : ""), String(row.overdue)));
      const areas = el("td", "load-areas");
      // Products first, then the tracker's areas - the coarse answer before the fine one.
      // Capped at four, with the rest counted: this column is a hint about where somebody
      // works, and twelve chips would push the numbers off the screen.
      const labels = [
        ...row.products.map(([id, n]) => [productPathLabel(id), n]),
        ...row.areas.map(([id, n]) => [id, n]),
      ];
      for (const [label, n] of labels.slice(0, 4)) {
        areas.appendChild(chip(n > 1 ? `${label} ${n}` : label));
      }
      if (labels.length > 4) areas.appendChild(el("span", "load-more", `+${labels.length - 4}`));
      if (!labels.length) areas.appendChild(el("span", "load-more", "—"));
      tr.appendChild(areas);
      body.appendChild(tr);
    }
    table.appendChild(body);
    wrap.appendChild(table);
    return wrap;
  }

  function renderAll() {
    board.textContent = "";
    // The one place the data behind the sections can have moved (see currentGroups).
    invalidateGroups();
    renderUnattributedBar();
    const slot = document.getElementById("pm-nav-slot");
    if (slot) mountControls(slot);

    if (!Object.keys(PRODUCTS).length) {
      board.appendChild(el("p", "lens-empty", "No products are configured."));
      return;
    }
    if (groupBy === "initiative" && !PORTFOLIO.initiatives.length && !allChanges().length) {
      const empty = el("p", "lens-empty");
      empty.innerHTML =
        'No goals, initiatives or projects yet — set them up on the '
        + '<a href="/portfolio">portfolio page</a>, and changes will group here.';
      board.appendChild(empty);
      return;
    }
    // Above the board, in the person lens only: it is the assignment decision, and the
    // sections below it are the evidence. Built from the same groups the board draws.
    if (groupBy === "person") board.appendChild(renderLoadTable(currentGroups()));
    if (view === "timeline") renderTimeline(); else renderBoard();
  }

  function upsertItem(item) {
    const list = itemsByProduct[item.product] ?? (itemsByProduct[item.product] = []);
    const idx = list.findIndex((i) => i.id === item.id);
    if (idx >= 0) list[idx] = item; else list.push(item);
    renderAll();
  }

  function removeItem(product, id) {
    const list = itemsByProduct[product];
    if (!list) return;
    itemsByProduct[product] = list.filter((i) => i.id !== id);
    renderAll();
  }

  function loadBoard() {
    return fetch("/roadmap/data")
      .then((r) => r.json())
      .then((data) => {
        PRODUCTS = data.products;
        PRODUCT_PARENTS = data.product_parents || {};
        SYSTEMS = data.systems || {};
        PRODUCT_SYSTEMS = data.product_systems || {};
        PRODUCT_META = data.product_meta || {};
        UNATTRIBUTED = data.unattributed || UNATTRIBUTED;
        itemsByProduct = data.items;
        PORTFOLIO = data.portfolio || PORTFOLIO;
        TRACKERS = data.trackers || TRACKERS;
        PEOPLE = data.people || [];
        PEOPLE_BY_ID = Object.fromEntries(PEOPLE.map((p) => [p.id, p]));
        indexProjects();
        renderTrackerBar();
        renderAll();
      });
  }

  // ---- tracker sync status ----

  function renderTrackerBar() {
    const bar = document.getElementById("tracker-bar");
    bar.classList.toggle("visible", !!TRACKERS.configured);
    if (!TRACKERS.configured) return;
    bar.textContent = "";

    for (const tracker of TRACKERS.trackers) {
      const status = tracker.status;
      // Three states, each explicit: synced, failed, never synced. A tracker that has
      // never run must not look the same as one holding zero tickets.
      const state = !status || (!status.ok && !status.error)
        ? "never"
        : status.error
        ? "failed"
        : "ok";
      const chipEl = el("span", `tracker-chip ${state}`);
      chipEl.appendChild(el("span", "dot", state === "ok" ? "●" : state === "failed" ? "▲" : "○"));

      let text;
      if (!tracker.usable) {
        text = `${tracker.label} — not configured: ${tracker.unusable_reason}`;
        chipEl.className = "tracker-chip failed";
      } else if (state === "failed") {
        text = `${tracker.label} — sync failed: ${status.error}`;
      } else if (state === "never") {
        text = `${tracker.label} — not synced yet`;
      } else {
        const when = relativeTime(status.finished_at);
        text =
          `${tracker.label} — ${tracker.ticket_count} ticket${tracker.ticket_count === 1 ? "" : "s"}` +
          (when ? `, synced ${when}` : "") +
          (status.truncated ? " (capped — only the most recently changed were pulled)" : "");
      }
      chipEl.appendChild(el("span", null, text));
      bar.appendChild(chipEl);

      // The last import pass, for a tracker that routes: what landed, and which
      // components had importable tickets nobody has routed yet - named, so the fix
      // is a config line rather than an investigation. Silent when routing is off.
      const imp = (TRACKERS.imports || {})[tracker.id];
      if (imp) {
        if (imp.imported) {
          bar.appendChild(el("span", "tracker-chip ok", `↳ imported ${imp.imported} change${imp.imported === 1 ? "" : "s"}`));
        }
        if (imp.unrouted_total) {
          const c = el("span", "tracker-chip never",
            `↳ ${imp.unrouted_total} importable ticket${imp.unrouted_total === 1 ? "" : "s"} with no route`);
          c.title = Object.entries(imp.unrouted).map(([k, n]) => `${k}: ${n}`).join("\n");
          bar.appendChild(c);
        }
        // Linked BEFORE the deployment excluded the slice, so the exclusion gate never
        // saw them. Reported, never removed - the sync will not delete a project a human
        // may have filed and planned around, so this chip is where that call is asked
        // for. Its tooltip names every one, because "go find them" is not a report.
        const stale = imp.stale_excluded;
        if (stale && stale.total) {
          const c = el("span", "tracker-chip never",
            `↳ ${stale.total} still linked to excluded ticket${stale.total === 1 ? "" : "s"}`);
          c.title = [...stale.projects.map((s) => `project ${s.ticket_key} — ${s.title}`),
                     ...stale.changes.map((s) => `change ${s.ticket_key} — ${s.title}`)].join("\n");
          bar.appendChild(c);
        }
      }
    }

    const button = el("button", null, TRACKERS.syncing ? "Syncing…" : "Sync now");
    button.type = "button";
    button.disabled = !!TRACKERS.syncing;
    button.addEventListener("click", () => {
      button.disabled = true;
      button.textContent = "Syncing…";
      fetch("/trackers/sync", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })
        .then((r) => r.json().then((body) => ({ ok: r.ok, body })))
        .then(({ ok, body }) => {
          if (!ok) {
            button.disabled = false;
            button.textContent = "Sync now";
            alert(body.detail || "Could not start a sync.");
            return;
          }
          TRACKERS = body.trackers ? body : TRACKERS;
          // The finished state arrives on the roadmap socket as `trackers_synced`.
        })
        .catch(() => {
          button.disabled = false;
          button.textContent = "Sync now";
        });
    });
    bar.appendChild(button);
  }

  /* ---- push: creating the ticket for a change planned here ----

     The inverse of linking. Linking says "this change is already that ticket"; pushing
     says "this change has no ticket anywhere - make one". Everything below is gated on
     `tracker.push` being present in GET /trackers, which the server only sets for a
     tracker that declares a [trackers.push] target AND has a working credential. So on a
     read-only deployment none of this renders at all, rather than rendering disabled. */

  function pushTrackers() {
    return (TRACKERS.trackers || []).filter((t) => t.push);
  }

  /* "a Story" but "an Epic". The issue type is operator-configured free text, so the
     article has to be chosen rather than written into the sentence. */
  const article = (word) => (/^[aeiou]/i.test(word || "") ? "an" : "a");

  /* The epic a pushed change will land under, mirroring server._parent_epic_for so the
     dialog promises exactly what the server will do. Empty unless the change's project
     is linked to an epic IN THE TRACKER being pushed to. */
  function pushParentKey(item, trackerId) {
    const project = item.project_id ? PROJECTS_BY_ID[item.project_id] : null;
    if (!project || !project.ticket || project.tracker_id !== trackerId) return "";
    return project.ticket.key || "";
  }

  /* The one place a push is actually sent, shared by both dialogs.
     `button` is disabled for the duration: a push is not idempotent, and a double-click
     that created two tickets would be this feature's worst failure. */
  function runPush(button, url, payload, onDone) {
    const original = button ? button.textContent : "";
    if (button) { button.disabled = true; button.textContent = "Pushing…"; }
    const finish = (message, isError) => {
      if (button) { button.disabled = false; button.textContent = original; }
      if (onDone) onDone(message, isError);
      else if (message) alert(message);
    };
    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload || {}),
    })
      .then((r) => r.json().then((body) => ({ ok: r.ok, body })))
      .then(({ ok, body }) => {
        if (!ok) {
          finish(body.detail || "Could not create the ticket.", true);
          return;
        }
        // A parent Jira would not accept is surfaced, never swallowed: the ticket is
        // real and correct, it just isn't under its epic, and only saying so lets
        // someone go fix it (see JiraClient.create_issue on why this can happen).
        const push = body.push || {};
        finish(
          push.parent_skipped
            ? `Created ${push.key}, but this Jira would not accept a parent, so it is ` +
              "not under its project's epic. Set the epic link in Jira."
            : "",
          false
        );
        // The card updates itself from the roadmap websocket's upsert event.
      })
      .catch(() => finish("Could not reach the server.", true));
  }

  // ---- link picker ----

  const picker = document.getElementById("ticket-picker");
  const pickerInput = document.getElementById("picker-input");
  const pickerResults = document.getElementById("picker-results");
  const pickerNote = document.getElementById("picker-note");
  const pickerPush = document.getElementById("picker-push");
  const pickerSub = document.getElementById("picker-sub");
  const pickerUnlink = document.getElementById("picker-unlink");
  const pickerLink = document.getElementById("picker-link");
  /* What the picker is linking right now: a change (`kind: "item"`) or a project's
     epic (`kind: "project"`). One dialog serves both because the flow is identical -
     search or paste, pick, PATCH - and only the target URL and the type filter differ. */
  let pickerTarget = null;
  let searchTimer = null;
  // Monotonic id of the newest in-flight ticket search; see searchTickets.
  let searchSeq = 0;

  function openTicketPicker(item) {
    // "Create or link" only where creating is actually possible - a read-only deployment
    // gets the plain "Link a ticket" it had before push existed, rather than a heading
    // offering an option its dialog does not contain.
    const canCreate = pushTrackers().length > 0;
    openPicker({
      kind: "item",
      title: item.title,
      // Carried whole, not just its title: the push section needs project_id to say
      // which epic the created ticket will hang under (see renderPushParent).
      item,
      ticket: item.ticket,
      url: `/roadmap/${item.product}/items/${item.id}`,
      heading: item.ticket || !canCreate ? "Link a ticket" : "Create or link a ticket",
      sub: item.ticket
        ? `"${item.title}" is linked to ${item.ticket.key}. Pick another ticket to move the link, or unlink it.`
        : canCreate
          ? `"${item.title}" has no ticket. Create one below, or link the ticket that `
            + "already exists — a ticket can belong to one change only."
          : `Link "${item.title}" to one ticket. A ticket can belong to one change only.`,
    });
  }

  function openEpicPicker(project) {
    const canPush = pushTrackers().length > 0;
    openPicker({
      kind: "project",
      title: project.title,
      item: project,
      ticket: project.ticket,
      url: `/portfolio/projects/${project.id}`,
      // Only epic-level tickets are offered (and accepted server-side): a project is
      // what an epic is in the tracker's own hierarchy.
      type: "epic",
      heading: project.ticket || !canPush ? "Link an epic" : "Create or link an epic",
      sub: project.ticket
        ? `"${project.title}" is tracked as ${project.ticket.key}. Pick another epic to move the link, or unlink it.`
        : canPush
          ? `"${project.title}" only exists here so far. Create its epic in the tracker below, or link ` +
            "the one that already exists there."
          : `"${project.title}" only exists locally so far — it is pending upload to the tracker, which no ` +
            "tracker here is set up for. If its epic already exists there, link it here.",
    });
  }

  function openPicker(target) {
    pickerTarget = target;
    pickerInput.value = "";
    pickerNote.textContent = "";
    pickerNote.classList.remove("error");
    document.getElementById("picker-title").textContent = target.heading;
    pickerSub.textContent = target.sub;
    pickerUnlink.classList.toggle("hidden", !target.ticket);
    renderPushSection(target);
    picker.classList.add("open");
    pickerInput.focus();
    searchTickets("");
  }

  /* "It isn't in the tracker at all — create it." Offered only for something UNLINKED:
     re-pointing an existing link is a link, not a push, and offering both at once would
     invite a duplicate ticket for work that already has one.

     This is where the config default gets overridden. The row's Push button is the
     one-click path that takes [trackers.push] as-is; here the tracker, its project and
     the issue type are all editable, because which project a given change belongs in is
     a per-change fact that config can only guess at. */
  function renderPushSection(target) {
    const section = pickerPush;
    section.textContent = "";
    const targets = pushTrackers();
    if (target.ticket || !targets.length) {
      section.classList.add("hidden");
      return;
    }
    section.classList.remove("hidden");

    const isEpic = target.kind === "project";
    section.appendChild(el("div", "push-lead",
      isEpic
        ? "Create the epic in the tracker and link it, in one step:"
        : "Create the ticket in the tracker and link it, in one step:"));

    const fields = el("div", "push-fields");
    const trackerSelect = el("select");
    for (const t of targets) {
      const option = el("option", null, t.label);
      option.value = t.id;
      trackerSelect.appendChild(option);
    }
    const projectSelect = el("select");
    const typeInput = el("input");
    typeInput.type = "text";
    // Free text, not a select: the issue types a project offers are per-instance and
    // this page has never pulled them. A wrong one comes back as Jira's own error
    // naming the types that exist, which is more useful than a list we guessed.
    typeInput.setAttribute("aria-label", "Issue type");

    /* The tracker choice drives the other two, so they are re-filled from its own
       declared target rather than left showing the previous tracker's project. */
    const syncToTracker = () => {
      const t = targets.find((x) => x.id === trackerSelect.value) || targets[0];
      projectSelect.textContent = "";
      for (const key of t.push.projects) {
        const option = el("option", null, key);
        option.value = key;
        projectSelect.appendChild(option);
      }
      projectSelect.value = t.push.project;
      typeInput.value = isEpic ? t.push.epic_type : t.push.change_type;
      renderPushParent(t.id);
    };
    trackerSelect.addEventListener("change", syncToTracker);

    for (const [label, node] of [
      ["Tracker", trackerSelect],
      ["Project", projectSelect],
      ["Issue type", typeInput],
    ]) {
      // One tracker is the common case and a select of one is noise, so its row is
      // dropped - the lead text and the button already name the tracker.
      if (node === trackerSelect && targets.length < 2) continue;
      const wrap = el("label");
      wrap.appendChild(el("span", null, label));
      wrap.appendChild(node);
      fields.appendChild(wrap);
    }

    const createBtn = el("button", null, "Create and link");
    createBtn.type = "button";
    createBtn.addEventListener("click", () => {
      const type = typeInput.value.trim();
      if (!type) {
        pickerNote.textContent = "Name the issue type to create.";
        pickerNote.classList.add("error");
        return;
      }
      const t = targets.find((x) => x.id === trackerSelect.value) || targets[0];
      const parent = isEpic ? "" : pushParentKey(target.item || {}, t.id);
      // Confirmed, not just clicked: this files a real ticket on a board other people
      // work from, and it cannot be undone from here - PM Studio never deletes upstream.
      if (!confirm(
        `Create ${article(type)} ${type} in ${t.label} (${projectSelect.value}) for:\n\n` +
        `${target.title}\n\n` +
        (parent ? `It will hang under ${parent}, its project's epic.\n` : "") +
        "This creates a real ticket on that board and links it here."
      )) return;
      pickerNote.textContent = "";
      pickerNote.classList.remove("error");
      runPush(
        createBtn,
        `${target.url}/push`,
        { tracker_id: trackerSelect.value, project: projectSelect.value, issue_type: type },
        (message, isError) => {
          if (isError) {
            pickerNote.textContent = message;
            pickerNote.classList.add("error");
            return;
          }
          closeTicketPicker();
          if (message) alert(message);
        }
      );
    });
    fields.appendChild(createBtn);
    section.appendChild(fields);
    // Where the new ticket will sit in the tracker's hierarchy, stated before the click.
    section.appendChild(el("div", "push-parent"));
    syncToTracker();
  }

  function renderPushParent(trackerId) {
    const node = pickerPush.querySelector(".push-parent");
    if (!node) return;
    const item = pickerTarget && pickerTarget.item;
    const parent = item ? pushParentKey(item, trackerId) : "";
    node.textContent = parent
      ? `It will hang under ${parent}, its project's epic.`
      : "";
  }

  function closeTicketPicker() {
    picker.classList.remove("open");
    pickerTarget = null;
    pickerResults.textContent = "";
    pickerPush.textContent = "";
    pickerPush.classList.add("hidden");
  }

  /* Every row here is a ticket you can actually pick: the server leaves out anything
     already backing a change or a project, and anything resolved won't-do. `hidden`
     counts both by reason - said out loud, because a search that returns two rows out of
     eleven matches otherwise reads as broken rather than as filtered, and "unlink it
     there" and "it is not happening" are not the same problem. */
  function searchTickets(query) {
    const type = pickerTarget && pickerTarget.type ? `&type=${pickerTarget.type}` : "";
    // Only the newest request may paint. Debouncing keystrokes narrows the window but does
    // not close it: two requests in flight can come back in either order, and the slower
    // older one would then leave the list showing results for a query nobody is typing
    // any more - with a hidden-count footnote to make the wrong answer look authoritative.
    const seq = ++searchSeq;
    fetch(`/trackers/tickets?q=${encodeURIComponent(query)}&limit=50${type}`)
      .then((r) => r.json())
      .then(({ tickets, hidden }) => {
        if (seq !== searchSeq) return;
        const linked = (hidden && hidden.linked) || 0;
        const declined = (hidden && hidden.declined) || 0;
        pickerResults.textContent = "";
        if (!tickets.length) {
          // Four reasons for an empty list, needing four different answers: everything
          // matching is taken, everything matching is declined, nothing matches, or
          // nothing is synced at all. "No match" and "all withheld" look identical on
          // screen and have nothing in common as problems.
          const rung = pickerTarget && pickerTarget.type === "epic" ? "epic" : "ticket";
          let message;
          if (linked && declined) {
            message = `Every ${rung} matching that is either already linked here ` +
              `(${linked}) or resolved won't-do (${declined}), so none is offered.`;
          } else if (linked) {
            message = `Every ${rung} matching that is already linked to something here ` +
              `(${linked} hidden). Unlink it there first, or create a new one.`;
          } else if (declined) {
            message = `Every ${rung} matching that is resolved won't-do (${declined} ` +
              "hidden) — declined work is never offered. Create a new one instead.";
          } else if (TRACKERS.trackers.some((t) => t.ticket_count)) {
            message = "No synced ticket matches that. You can still paste a full URL or key above.";
          } else {
            message = "Nothing synced yet — run a sync, or paste a ticket URL or key above.";
          }
          pickerResults.appendChild(el("div", "lens-empty", message));
          return;
        }
        for (const ticket of tickets) {
          const row = el("button", "picker-row");
          row.type = "button";
          row.appendChild(ticketBadge({ ...ticket, url: "" }, false));
          row.appendChild(el("span", "row-title", ticket.title || "(no title)"));
          row.addEventListener("click", () => submitLink({ tracker_id: ticket.tracker_id, ticket_key: ticket.key }));
          pickerResults.appendChild(row);
        }
        // Why the list is shorter than the catalog, by reason - the two are not the same
        // problem, so they are not collapsed into one number.
        const why = [];
        if (linked) why.push(`${linked} already linked here`);
        if (declined) why.push(`${declined} resolved won't-do`);
        if (why.length) {
          pickerResults.appendChild(el("div", "picker-hidden",
            `Not shown: ${why.join(", ")}.`));
        }
      })
      .catch(() => {});
  }

  function submitLink(payload) {
    if (!pickerTarget) return;
    pickerNote.textContent = "Linking…";
    pickerNote.classList.remove("error");
    pickerLink.disabled = true;
    fetch(pickerTarget.url, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    })
      .then((r) => r.json().then((body) => ({ ok: r.ok, body })))
      .then(({ ok, body }) => {
        pickerLink.disabled = false;
        if (!ok) {
          // The 409 body names the change already holding the ticket, which is the whole
          // point of surfacing it here rather than just saying "conflict".
          pickerNote.textContent = body.detail || "Could not link that ticket.";
          pickerNote.classList.add("error");
          return;
        }
        closeTicketPicker();
        // The board updates itself from the roadmap websocket's upsert event.
      })
      .catch(() => {
        pickerLink.disabled = false;
        pickerNote.textContent = "Could not reach the server.";
        pickerNote.classList.add("error");
      });
  }

  pickerInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => searchTickets(pickerInput.value.trim()), 150);
  });
  pickerInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      pickerLink.click();
    }
  });
  // The typed value is sent as `ticket`, which the server resolves from a URL or a bare
  // key against the configured trackers (see _apply_ticket_link).
  pickerLink.addEventListener("click", () => {
    const raw = pickerInput.value.trim();
    if (!raw) {
      pickerNote.textContent = "Paste a ticket URL or key, or pick one from the list.";
      pickerNote.classList.add("error");
      return;
    }
    submitLink({ ticket: raw });
  });
  pickerUnlink.addEventListener("click", () => submitLink({ ticket: "" }));
  document.getElementById("picker-cancel").addEventListener("click", closeTicketPicker);
  picker.addEventListener("click", (event) => {
    if (event.target === picker) closeTicketPicker();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && picker.classList.contains("open")) closeTicketPicker();
  });

  loadBoard();

  const ws = new WebSocket(`ws://${location.host}/ws/roadmap`);
  ws.onmessage = (msg) => {
    const event = JSON.parse(msg.data);
    if (event.type === "roadmap_item_upserted") upsertItem(event.item);
    if (event.type === "roadmap_item_deleted") removeItem(event.product, event.id);
    // A project being re-parented or an initiative closing changes how this board
    // groups, but says nothing about the items themselves - so refetch rather than
    // trying to patch the work model incrementally.
    if (event.type === "portfolio_changed") loadBoard();
    // A sync finished: statuses changed, and so did every linked card's badge, so take
    // the whole board again rather than reconciling ticket-by-ticket.
    if (event.type === "trackers_synced") loadBoard();
  };
</script>
</body>
</html>
