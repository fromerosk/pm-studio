    pending.tabIndex = 0;
    const go = (event) => {
      event.stopPropagation();
      open();
    };
    pending.addEventListener("click", go);
    pending.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); go(event); }
    });
    return pending;
  }

  /* The tracker rung for a CHANGE, in its two states - deliberately the same shape
     projectEpicNode gives a project, so both say the same thing the same way. Null only
     when there is no tracker to be absent from. */
  function itemTicketNode(item, compact) {
    if (item.ticket) return ticketBadge(item.ticket, compact);
    if (!TRACKERS.configured) return null;
    return notInTrackerChip("ticket", () => openTicketPicker(item));
  }

  // ---- the change, in its two shapes ----

  function chip(text, className) {
    const node = el("span", "chip" + (className ? " " + className : ""), text);
    node.title = text;
    return node;
  }

  /* The glyph that says what kind of row this is - see the .kind rules. Drawn inline
     rather than pulled from an icon font or a sprite so it inherits the row's own
     colour and needs no second request; the paths are constants, never user text. */
  const KIND_SHAPES = {
    // A box: a product is the container everything else sits in.
    product: '<path d="M8 1.9 14 5.1v5.8L8 14.1 2 10.9V5.1z"/><path d="M2 5.1 8 8.3l6-3.2M8 8.3v5.8"/>',
    // A flag: an initiative is a bet planted somewhere, spanning whatever it spans.
    initiative: '<path d="M4 14.2V2.2"/><path d="M4 2.9h8L10.2 5.8 12 8.7H4z"/>',
    // A folder: a project holds changes.
    project: '<path d="M1.9 12.3V4.3a.5.5 0 0 1 .5-.5h3.3l1.5 1.8h6.4a.5.5 0 0 1 .5.5v6.2a.5.5 0 0 1-.5.5H2.4a.5.5 0 0 1-.5-.5z"/>',
    // Head and shoulders: a person, the only section kind that is not a container.
    person: '<path d="M8 8.4a3.1 3.1 0 1 0 0-6.2 3.1 3.1 0 0 0 0 6.2z"/><path d="M2.6 14.1a5.4 5.4 0 0 1 10.8 0"/>',
  };
  const KIND_LABELS = {
    product: "Product",
    subproduct: "Sub-product",
    initiative: "Initiative",
    project: "Project",
    loose: "Changes with no project",
    person: "Person",
    nobody: "Work nobody is on",
  };
  function kindIcon(kind) {
    // A sub-product is a product and the "No project" bucket is a project-shaped slot,
    // so they reuse those shapes rather than inventing a fifth thing to learn.
    const shape = kind === "subproduct" ? "product"
      : kind === "loose" ? "project"
      // Unassigned work is a person-shaped slot with nobody in it, drawn dashed below
      // for the same reason the "no project" row is.
      : kind === "nobody" ? "person"
      : kind;
    const node = el("span", `kind kind-${kind}`);
    node.title = KIND_LABELS[kind] || kind;
    node.innerHTML =
      '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor"'
      + ' stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"'
      // Dashed: nothing declared this row, it is where the leftovers went.
      + (kind === "loose" || kind === "nobody" ? ' stroke-dasharray="2.4 2"' : "")
      + `>${KIND_SHAPES[shape]}</svg>`;
    return node;
  }

  /* An initiative section is an initiative at any depth (they don't nest); a product
     section drawn inside another one is a sub-product, which is a fact about where it
     is rather than about the product itself - so it is read off the depth, not the
     group. */
  function groupKind(group, depth) {
    if (group.kind === "initiative") return "initiative";
    // A person section never nests either, so like an initiative it is read off the
    // group rather than the depth. `nobody` is its own glyph: the pile of work with
    // no name on it should not look like somebody called "Nobody assigned".
    if (group.kind === "person") return group.key === "person:none" ? "nobody" : "person";
    return depth ? "subproduct" : "product";
  }

  /* The activity glyph a section heading carries and the Show filter's vocabulary -
     label and meaning in one place so the icon tooltip, the filter button and the
     hidden-note all say the same thing. */
  const STATE_META = {
    active: { label: "Active", hint: "Working — open changes in Now or Next" },
    inactive: { label: "Inactive", hint: "Inactive — nothing in Now or Next" },
    completed: { label: "Completed", hint: "Completed — an initiative all of whose work is done" },
  };
  const STATE_SHAPES = {
    // A play triangle: this board is being worked right now.
    active: '<path d="M5.2 3.1 12.8 8l-7.6 4.9z" fill="currentColor" stroke="none"/>',
    // A check: nothing left underneath it.
    completed: '<path d="M3 8.6 6.4 12 13 4.4"/>',
    // A pause: parked, not finished - it still holds work, just none of it soon.
    inactive: '<path d="M6 3.4v9.2M10 3.4v9.2"/>',
  };
  function stateIcon(state) {
    const node = el("span", `state ${state}`);
    node.title = STATE_META[state].hint;
    node.innerHTML =
      '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor"'
      + ' stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'
      + STATE_SHAPES[state] + "</svg>";
    return node;
  }

  // Rebuilt whenever the work model changes, rather than per card - a full board render
  // asks for a change's project once per chip, and there is one chip per card.
  let PROJECTS_BY_ID = {};
  let INITIATIVES_BY_ID = {};
  function indexProjects() {
    PROJECTS_BY_ID = Object.fromEntries(PORTFOLIO.projects.map((p) => [p.id, p]));
    INITIATIVES_BY_ID = Object.fromEntries(PORTFOLIO.initiatives.map((i) => [i.id, i]));
  }

  /* The session-activity readout for a project: {last_at, recent_sessions}, or null.
     This is how an ideation project testifies to being alive - it has no changes by
     definition, so the roadmap itself cannot. The recency window is the server's
     (see server.ACTIVITY_RECENT_DAYS); the board never re-derives it. */
  function projectActivity(projectId) {
    return (PORTFOLIO.activity || {})[projectId] || null;
  }

  /* Why a project looks finished, or null. Computed server-side (see
     _close_candidates) because the deciding fact is not on this page: whether the
     EPIC still has open children in the tracker. A project whose every local change
     shipped can be a partially imported epic with six open stories nobody routed here,
     and the board must not offer to close that. Three reasons:
       tracker  - the epic itself is done; safe to close, and what the sync pass closes
                  on its own once close_done_epics is enabled.
       changes  - all local work settled but the epic is still open (or there is no
                  epic). Offered, never automatic: an open epic is a live claim by the
                  system that actually runs the work.
       blocked  - all local work settled and the epic disagrees. A warning, not an offer.
  */
  function closeCandidate(projectId) {
    return (PORTFOLIO.close_candidates || {})[projectId] || null;
  }

  /* Whether any project under this section - catch-alls included, since an
     initiative-scoped session's brainstorming lands in its catch-all until the idea
     names a project - was touched by a session recently. */
  function groupIdeationAlive(group) {
    return (group.projectIds || []).some((id) => {
      const act = projectActivity(id);
      return act && act.recent_sessions > 0;
    });
  }

  /* The metadata a change carries, minus whatever the surrounding section already says.
     `omit` is how one function serves both groupings: a product section doesn't repeat
     the product on every card, an initiative section doesn't repeat the initiative. */
  function metaChips(item, omit = {}) {
    const chips = [];
    /* Leads the row, because it changes how the rest of the card reads: a "next" bucket
       and an unmet target date mean nothing on work the tracker has declined. The status
       dot still says pending - that IS its local status, and the status mirror refuses to
       call declined work done (see isOutstanding) - so this chip is the only thing that
       explains why the board's counts do not include it. */
    if (item.ticket && item.ticket.is_wont_do) chips.push(chip("declined in tracker"));
    // The full path, because this chip only appears where the section does NOT name the
    // product (the initiative lens) - and there, "Billing" alone doesn't say whose.
    if (!omit.product) chips.push(chip(productPathLabel(item.product)));
    // The system a change is contained within - shown in both lenses, because unlike the
    // product and the initiative it is never what a section is grouped by. Named whenever
    // there is one; its absence is flagged only where the product is in scope, so a board
    // whose edge is still undeclared reads exactly as it did before the layer existed
    // rather than turning every card amber over missing config.
    if (item.system) chips.push(chip(SYSTEMS[item.system] || item.system));
    else if (requiresSystem(item.product)) chips.push(chip("no system", "warn"));
    const project = PROJECTS_BY_ID[item.project_id];
    // Inside a project row the project is the row's own heading, so repeating it on
    // every card would print the same word a dozen times down one column.
    if (!omit.project) {
      if (project) chips.push(chip(project.title));
      // Alignment is a practice the board surfaces, never a validation that blocks work -
      // so an unaligned change is flagged on its card and still shown everywhere else.
      else chips.push(chip("unaligned", "warn"));
    }
    if (item.owner) chips.push(chip(`External — ${item.owner}`, "owner"));
    /* Who is on it. Not repeated inside a person section, which is the whole heading.
       Three shapes, because the three states are genuinely different things:
         - a local assignment somebody made here (plain);
         - the tracker's own assignee, nobody here has overridden (suffixed with the
           tracker's word, so it is clear nothing was decided on this board);
         - the two disagreeing, which is flagged - a local reassignment the tracker has
           not been told about is exactly the thing somebody has to go and say out loud.
       An id that resolves to nobody still says so, rather than reading as unassigned. */
    if (!omit.person) {
      const assigned = assignedTo(item);
      if (assigned.conflict) {
        chips.push(chip(
          `${assigned.name} — ${assigned.tracker_name} in the tracker`, "assignee conflict"));
      } else if (assigned.name) {
        chips.push(chip(
          assigned.source === "tracker" ? `${assigned.name} (from tracker)` : assigned.name,
          "assignee" + (assigned.status === "inactive" ? " warn" : "")));
      } else if (assigned.assignee_id) {
        chips.push(chip("assigned to someone no longer in the directory", "warn"));
      }
    }
    // The schedule, in whatever shape it has. `is_overdue` is computed server-side
    // (roadmap.py) so the board and the PM's context block never disagree about what
    // "late" means on a machine whose clock or timezone differs.
    if (item.is_overdue) {
      chips.push(chip(`Overdue — ${dateLabel(item.target_at)}`, "late"));
    } else if (item.start_at && item.target_at) {
      chips.push(chip(`${dateLabel(item.start_at)} → ${dateLabel(item.target_at)}`, "dates"));
    } else if (item.target_at) {
      chips.push(chip(`Target ${dateLabel(item.target_at)}`, "dates"));
    } else if (item.start_at) {
      chips.push(chip(`Started ${dateLabel(item.start_at)}`, "dates"));
    }
    return chips;
  }

  /* Every write the board can make to one change, in one place, used by the card in the
     lane view and by the detail panel in the timeline view. */
  function itemControls(item) {
    const row = el("div", "controls");

    const statusSelect = el("select", "mini");
    statusSelect.title = "Status";
    for (const [value, label] of Object.entries(STATUS_LABEL)) {
      const opt = el("option", null, label);
      opt.value = value;
      opt.selected = value === item.status;
      statusSelect.appendChild(opt);
    }
    statusSelect.addEventListener("change", () => patchItem(item, { status: statusSelect.value }));
    row.appendChild(statusSelect);

    const bucketSelect = el("select", "mini");
    bucketSelect.title = "Horizon";
    for (const [value, label] of BUCKETS) {
      const opt = el("option", null, label);
      opt.value = value;
      opt.selected = value === item.bucket;
      bucketSelect.appendChild(opt);
    }
    bucketSelect.addEventListener("change", () => patchItem(item, { bucket: bucketSelect.value }));
    row.appendChild(bucketSelect);

    /* Re-attribution, in the same row as status and horizon. There is no blank option for
       an already-attributed change: a system is not something a change can go back to not
       having (see roadmap.validate_system). One appears only while it IS unattributed, as
       the prompt to fix it - and it is not selectable once anything else is chosen. */
    if (requiresSystem(item.product)) {
      const systemSelect = el("select", "mini");
      systemSelect.title = "The system this change is contained within";
      if (!item.system) {
        const prompt = el("option", null, "No system — pick one");
        prompt.value = "";
        systemSelect.appendChild(prompt);
      }
      for (const id of allowedSystems(item.product)) {
        const opt = el("option", null, SYSTEMS[id] || id);
        opt.value = id;
        opt.selected = id === item.system;
        systemSelect.appendChild(opt);
      }
      systemSelect.addEventListener("change", () => {
        if (!systemSelect.value) return;
        patchItem(item, { system: systemSelect.value });
      });
      row.appendChild(systemSelect);
    }

    const moveSelect = el("select", "mini");
    moveSelect.title = "Move to another product";
    const placeholder = el("option", null, "Move to…");
    placeholder.value = "";
    moveSelect.appendChild(placeholder);
    /* Grouped by family, one optgroup per top-level product holding its whole subtree in
       display order, indented one step per level: a flat list of every board stops being
       readable at the point a deployment has a dozen sub-products, which is exactly when
       moving things between them starts to matter. A top-level product with nothing below
       it is a plain option, not a group of one. */
    for (const top of topLevelProducts()) {
      const family = subtreeProducts(top).filter((id) => id !== item.product);
      if (!family.length) continue;
      const option = (id) => {
        const indent = depthOf(id) - depthOf(top);
        const opt = el("option", null,
          indent ? `${" ".repeat(indent * 2)}↳ ${productLabel(id)}` : productLabel(id));
        opt.value = id;
        // The closed select shows only the chosen option, so it carries the whole path.
        opt.title = productPathLabel(id);
        return opt;
      };
      if (subtreeProducts(top).length === 1) {
        moveSelect.appendChild(option(top));
        continue;
      }
      const optgroup = document.createElement("optgroup");
      optgroup.label = productLabel(top);
      for (const id of family) optgroup.appendChild(option(id));
      moveSelect.appendChild(optgroup);
    }
    moveSelect.addEventListener("change", () => {
      const target = moveSelect.value;
      if (!target) return;
      if (!confirm(`Move "${item.title}" to ${productPathLabel(target)}? It keeps its history and lands accepted on their board.`)) {
        moveSelect.value = "";
        return;
      }
      // A stakeholder acting on the board picked the destination directly, so it
      // lands already triaged - no extra accept step. A PM's own curl-based move
      // (see agent.py) omits this and lands untriaged for the destination to review.
      patchItem(item, { move_to_product: target, triaged: true });
    });
    row.appendChild(moveSelect);

    // The schedule. Two native date pickers rather than a prompt(), because a date is
    // the one field on this card where free text would mean parsing failures for a
    // stakeholder typing "end of Sept". Either can be cleared on its own; the server
    // refuses a start after its target and says so.
    for (const [field, label] of [["start_at", "Start"], ["target_at", "Target"]]) {
      const wrap = el("label", "date-field");
      wrap.appendChild(el("span", null, label));
      const input = el("input", "mini");
      input.type = "date";
      input.value = item[field] || "";
      input.title = `${label} date — clear the field to remove it`;
      input.addEventListener("change", () => patchItem(item, { [field]: input.value }));
      wrap.appendChild(input);
      row.appendChild(wrap);
    }

    /* Assignment: a picker, not a prompt(), because the directory already knows every
       name and a typo here would be an id nothing resolves. Local only - nothing on this
       board writes to Jira or ADO (see people.py) - so the label says whose decision it
       is, and unassigning a LINKED change hands the answer back to the tracker rather
       than to nobody. */
    const assigned = assignedTo(item);
    const assignSelect = el("select", "mini");
    assignSelect.title = item.ticket
      ? "Assign locally. The tracker is never written to — clear this to fall back to "
        + "whoever the ticket says is on it."
      : "Assign locally. This change has no ticket, so this is the only record of who is on it.";
    const noneOpt = el("option", null, item.ticket && assigned.source === "tracker" && assigned.name
      ? `From tracker — ${assigned.name}`
      : "Unassigned");
    noneOpt.value = "";
    noneOpt.selected = !item.assignee;
    assignSelect.appendChild(noneOpt);
    // Inactive people are not offered - but somebody already holding this change stays
    // listed, or the select would silently misreport who is on it.
    for (const person of PEOPLE) {
      if (person.status !== "active" && person.id !== item.assignee) continue;
      const opt = el("option", null, person.name);
      opt.value = person.id;
      opt.selected = person.id === item.assignee;
      assignSelect.appendChild(opt);
    }
    assignSelect.addEventListener("change", () => patchItem(item, { assignee: assignSelect.value }));
    row.appendChild(assignSelect);

    const ownerBtn = el("button", null, "Owner…");
    ownerBtn.type = "button";
    ownerBtn.title = "Track work done by another person or team";
    ownerBtn.addEventListener("click", () => {
      const owner = prompt(
        "Who is doing this work outside PM Studio (person or team)?\nLeave blank to mark it as built here.",
        item.owner || ""
      );
      if (owner === null) return;
      patchItem(item, { owner: owner.trim() });
    });
    row.appendChild(ownerBtn);

    if (TRACKERS.configured) {
      const ticketBtn = el("button", null, item.ticket ? "Ticket…" : "Link ticket…");
      ticketBtn.type = "button";
      ticketBtn.title = item.ticket
        ? `Change or remove the ${item.ticket.key} link`
        : "Link this change to one Jira or Azure DevOps ticket";
      ticketBtn.addEventListener("click", () => openTicketPicker(item));
      row.appendChild(ticketBtn);
      // No Push button here on purpose: pushing hangs off the "not in tracker" chip in
      // the card header (see itemTicketNode), where the absence it fixes is stated.
      // A second entry point buried behind the expand is what this replaced.
    }

    const del = el("button", "del", "Delete");
    del.type = "button";
    del.addEventListener("click", () => {
      if (!confirm(`Delete "${item.title}"?`)) return;
      fetch(`/roadmap/${item.product}/items/${item.id}`, { method: "DELETE" }).catch(() => {});
    });
    row.appendChild(del);

    return row;
  }

  function itemCard(item, omit) {
    const card = el("article", "card" + (openCards.has(item.id) ? " open" : ""));

    const main = el("button", "card-main");
    main.type = "button";
    main.setAttribute("aria-expanded", String(openCards.has(item.id)));
    const dot = el("span", `status-dot ${item.status}`);
    dot.title = STATUS_LABEL[item.status] || item.status;
    main.appendChild(dot);
    main.appendChild(el("span", "card-title", item.title));
    card.appendChild(main);

    // The ticket badge is a real link, so it sits outside the toggle button rather than
    // nested inside one - a link inside a button is neither reliably clickable nor valid.
    const meta = el("div", "card-meta");
    for (const node of metaChips(item, omit)) meta.appendChild(node);
    // Linked: the badge. Unlinked: "not in tracker", which is also the push affordance -
    // see itemTicketNode. Either way it is here, in the header, not behind the expand.
    const ticketNode = itemTicketNode(item, true);
    if (ticketNode) meta.appendChild(ticketNode);
    card.appendChild(meta);

    /* Built on first open. itemControls is the single most expensive thing the board
       draws - four selects, one of them an option per product board in the whole
       taxonomy - and a lane full of closed cards was paying for all of it up front. */
    const body = el("div", "card-body");
    const fillBody = buildOnce(() => {
      if (item.description) body.appendChild(el("div", "desc", item.description));
      if (item.ticket) body.appendChild(ticketBadge(item.ticket, false));
      body.appendChild(itemControls(item));
    });

    main.addEventListener("click", () => {
      const nowOpen = !openCards.has(item.id);
      if (nowOpen) { openCards.add(item.id); fillBody(); } else openCards.delete(item.id);
      card.classList.toggle("open", nowOpen);
      main.setAttribute("aria-expanded", String(nowOpen));
    });

    card.appendChild(body);
    if (openCards.has(item.id)) fillBody();

    return card;
  }

  function suggestionCard(item) {
    const card = el("div", "suggestion");
    const body = el("div", "body");
    body.appendChild(el("div", "title", item.title));
    body.appendChild(el("div", "from",
      `Suggested by ${productPathLabel(item.origin_product)}`
      + (item.description ? ` — ${item.description}` : "")));
    card.appendChild(body);

    const actions = el("div", "actions");
    const accept = el("button", "accept", "Accept");
    accept.type = "button";
    accept.addEventListener("click", () => patchItem(item, { triaged: true }));
    const dismiss = el("button", null, "Dismiss");
    dismiss.type = "button";
    dismiss.addEventListener("click", () => {
      fetch(`/roadmap/${item.product}/items/${item.id}`, { method: "DELETE" }).catch(() => {});
    });
    actions.appendChild(accept);
    actions.appendChild(dismiss);
    card.appendChild(actions);
    return card;
  }

  /* A PATCH can now be refused on its CONTENT, not just on permissions - a malformed
     date, or a start after its target, is a 400 naming the reason. Silently swallowing
     that would leave the control showing a value the server never stored, so the reason
     is shown and the board is refetched to put the control back to the truth. */
  function patchItem(item, fields) {
    return fetch(`/roadmap/${item.product}/items/${item.id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(fields),
    })
      .then((r) => {
        if (r.ok) return;
        return r.json().catch(() => ({})).then((body) => {
          alert(body.detail || "That change could not be saved.");
          loadBoard();
        });
      })
      .catch(() => {});
  }

  /* The systems a change on this product may be attributed to. Only ever called for a
     product in scope, so this is exactly what it declares - the server accepts any
     declared system on an out-of-scope board, but offering that here would invite the
     wrong attribution instead of leaving it for the config to say. */
  function allowedSystems(product) {
    return PRODUCT_SYSTEMS[product] || [];
  }

  function systemOptions(product, selected) {
    return allowedSystems(product)
      .map((id) => {
        const label = SYSTEMS[id] || id;
        return `<option value="${id}"${id === selected ? " selected" : ""}>${label}</option>`;
      })
      .join("");
  }

  function addForm(product, bucket, projectId) {
    const form = el("form", "add-form");
    // Required, not optional: a change is contained within exactly one system, so the
    // picker has no blank option and the server refuses a create without one. Absent
    // entirely on a board that is not in scope, where the server requires nothing.
    /* Assigning at creation, when there is anybody to assign to. Only active people are
       offered, and "Unassigned" stays the default: raising a change and deciding who does
       it are two decisions, and forcing the second one here would put a name on work that
       has not been handed to anybody yet. Absent entirely on an empty directory. */
    const assignable = PEOPLE.filter((person) => person.status === "active");
    // The shell only - the names are appended as DOM nodes below, never interpolated into
    // this template. A display name comes from Jira or ADO, so it is untrusted text; every
    // other name on this page reaches the DOM through el()'s textContent for the same
    // reason, and the markup here is limited to constants.
    const assigneeField = assignable.length
      ? `<label class="date-field"><span>Assign</span>
           <select class="mini assignee"><option value="">Unassigned</option></select>
         </label>`
      : "";
    const systemField = requiresSystem(product)
      ? `<label class="date-field"><span>System</span>
           <select class="mini system" required>${systemOptions(product)}</select>
         </label>`
      : "";
    form.innerHTML = `
      <input type="text" placeholder="Title" class="title" required />
      <textarea placeholder="Description (optional)" class="desc" rows="2"></textarea>
      <input type="text" placeholder="External owner (optional)" class="owner" />
      ${assigneeField}
      ${systemField}
      <label class="date-field"><span>Target</span><input type="date" class="mini target" /></label>
      <div class="buttons">
        <button type="button" class="cancel">Cancel</button>
        <button type="submit" class="primary">Add</button>
      </div>
    `;
    const assigneeSelect = form.querySelector(".assignee");
    if (assigneeSelect) {
      for (const person of assignable) {
        const option = el("option", null, person.name);
        option.value = person.id;
        assigneeSelect.appendChild(option);
      }
    }
    form.querySelector(".cancel").addEventListener("click", () => form.classList.remove("open"));
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = form.querySelector(".title").value.trim();
      if (!title) return;
      const payload = {
        title,
        description: form.querySelector(".desc").value.trim(),
        owner: form.querySelector(".owner").value.trim(),
        // Only the target is offered here: a date you commit to at the moment you raise
        // the change. A start date is something you set when work actually begins, so
        // it lives on the card rather than in the create form.
        target_at: form.querySelector(".target").value,
        bucket,
        status: "pending",
      };
      const systemField = form.querySelector(".system");
      if (systemField) payload.system = systemField.value;
      const assigneeField = form.querySelector(".assignee");
      if (assigneeField && assigneeField.value) payload.assignee = assigneeField.value;
      // Adding from inside an initiative section means the change belongs to that
      // initiative's work - so it lands on its project rather than unaligned.
      if (projectId) payload.project_id = projectId;
      fetch(`/roadmap/${product}/items`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      }).then((r) => {
        // Kept open with the typed values intact when the server refuses it - clearing
        // the form on a rejected date would throw away what the user just wrote.
        if (!r.ok) {
          return r.json().catch(() => ({})).then((body) => {
            alert(body.detail || "That change could not be created.");
          });
        }
        form.reset();
        form.classList.remove("open");
      }).catch(() => {});
    });
    return form;
  }

  // ---- grouping: the sections, whichever view draws them ----

  function allChanges() {
    return Object.values(itemsByProduct).flat();
  }

  /* Whether the search keeps this change on the board. A change matches through ANY
     title on its path - its own, its project's, its initiative's, its product's full
     path - so a query naming a container keeps that container's contents: typing
     "billing" shows the Billing board's cards rather than emptying the section whose
     heading just matched. Ticket keys count as titles here: the badge on a card is a
     name people know it by, and substring matching means the number alone ("5434")
     finds "NDT-5434" without asking anyone to type the project prefix. Applied at
     grouping time (both lenses filter their source through searchFilter), which keeps
     every count, state and tally downstream honest about what is actually drawn. */
  function projectMatchesSearch(project) {
    if (!project) return false;
    return matchesSearch([project.title, project.ticket && project.ticket.key]
      .filter(Boolean).join(" · "));
  }

  /* One haystack per change, not a field-by-field check: an AND has to be free to
     satisfy its terms from different fields - "billing and search" means search work
     on the Billing board, and no single field says both. */
  function changeMatchesSearch(change) {
    const project = PROJECTS_BY_ID[change.project_id];
    const initiative = project && project.initiative_id ? INITIATIVES_BY_ID[project.initiative_id] : null;
    return matchesSearch([
      change.title,
      change.ticket && change.ticket.key,
      productPathLabel(change.product),
      project && project.title,
      project && project.ticket && project.ticket.key,
      initiative && initiative.title,
      // A person's name is one of the things people type into this box, and it works in
      // every lens rather than only the one grouped by person.
      assignedTo(change).name,
    ].filter(Boolean).join(" · "));
  }

  function searchFilter(changes) {
    return searchActive() ? changes.filter(changeMatchesSearch) : changes;
  }

  /* A group is { key, title, flags, changes, omit, product, projectIds, subgroups }.

     `product` is the one product board this section is about, or null when it spans
     several - it is what lets a project row inside the section know where a new change
     would go. `projectIds` is an explicit, ordered list of the projects the section
     should show as rows even when they hold no changes yet (an initiative's own
     projects are part of its plan whether or not anything has been raised against them
     yet), or null to mean "just whatever the changes turn out to belong to".

     `subgroups` are sections nested INSIDE this one - a parent product's child products.
     Empty for every other kind of section. The invariant that makes the counting below
     safe: `changes` is always a section's OWN changes only, never its descendants', so
     every change belongs to exactly one section however deep the taxonomy goes. What a
     parent shows about its children it takes from the subgroups. */
  function groupsByProduct() {
    // `seen` is the same cycle guard subtreeProducts carries - this recursion is what
    // builds the whole board, so an unguarded one would hang the page.
    const productGroup = (product, seen = new Set()) => {
      seen.add(product);
      const meta = PRODUCT_META[product];
      return {
        key: `product:${product}`,
        kind: "product",
        title: productLabel(product),
        // The stage badge only when it says something: discovery/development/sunset are
        // the states worth a glance, steady-state ga is not. Owner and team ride the
        // heading's tooltip (see the head renderers) rather than being chrome.
        flags: meta && meta.stage !== "ga" ? [[meta.stage, false]] : [],
        changes: searchFilter(itemsByProduct[product] ?? []),
        omit: { product: true },
        product,
        // A product board doesn't own projects, so an empty project has no business
        // appearing under it - the rows are derived from the changes actually here.
        projectIds: null,
        subgroups: childrenOf(product)
          .filter((c) => !seen.has(c))
          .map((c) => productGroup(c, seen)),
      };
    };
    return topLevelProducts().map((p) => productGroup(p));
  }

  /* Every change a section holds, its sub-products included - what a parent's heading
     counts, since folded shut it stands for the whole family.

     Memoised onto the group, because this walk has several callers per section on every
     render (its state, its tally, its parent's nested count) and each one otherwise
     rebuilds the whole subtree's array. Safe to cache on the object: groups are thrown
     away and rebuilt whenever the data behind them changes - see invalidateGroups. */
  function groupChanges(group) {
    if (!group._changes) {
      group._changes = [...group.changes, ...(group.subgroups || []).flatMap(groupChanges)];
    }
    return group._changes;
  }

  function groupKeys(groups) {
    return groups.flatMap((g) => [g.key, ...groupKeys(g.subgroups || [])]);
  }

  /* Every section nested under this one at any depth. Counted rather than just the direct
     children, because the change count beside it is the whole subtree's - "+9 open in 2
     sub-products" when nine of them live in a grandchild would be quietly wrong about
     where the work is. */
  function groupDescendants(group) {
    return (group.subgroups || []).flatMap((g) => [g, ...groupDescendants(g)]);
  }

  /* Is this section being worked, done with, or dormant? Decided over the whole
     subtree - a parent whose only movement is in a grandchild is still moving, and
     hiding it would hide the path to that grandchild.

     In precedence order:
       active     any open change in Now or Next - imminence by bucket, nothing else.
                  Deliberately NOT "anything in progress": an in-progress change
                  parked in Later (tracker imports produce these in bulk) does not
                  make the board it sits on part of the current plan. The subtree
                  walk supplies the other half of the definition: a product is
                  active when a child product is.
       completed  initiatives only. An initiative is a bet, so it can be won: there is
                  work, and every piece of it is finished - all changes done, no
                  declared project still waiting to start. An initiative with no work
                  at all is NOT completed - nothing was done - and closing one changes
                  nothing here: only its children's work can complete it.
       inactive   the rest: only Later-bucket work, an untouched plan, or nothing at
                  all. Parked, not finished. A product lives here whenever it isn't
                  moving - products are ongoing things, never "completed", however
                  much of their history has shipped.

     A closed initiative holding open Now/Next work classifies active, not completed -
     stranded work is exactly what the board must keep in view.

     Memoised for the same reason groupChanges is: the sort, the Show filter, the filter
     counts and the heading's own icon all ask each section for its state, and the answer
     cannot change without the groups being rebuilt. */
  function groupState(group) {
    return group._state || (group._state = computeGroupState(group));
  }

  function computeGroupState(group) {
    const changes = groupChanges(group);
    const open = changes.filter(isOutstanding);
    if (open.some((c) => c.bucket === "now" || c.bucket === "next")) return "active";
    if (group.kind !== "initiative") return "inactive";
    // An initiative in ideation that sessions touched recently IS being worked -
    // capturing ideas, researching, checking data. It has no changes by definition,
    // so this is the one active state the roadmap cannot testify to itself; the
    // session-activity log does. Without recent activity it falls through to
    // "inactive" like anything else - a dormant idea should not stay green forever.
    if (group.inIdeation && groupIdeationAlive(group)) return "active";
    // A declared project with no changes yet is plan nobody has started - it keeps its
    // initiative out of "completed" the same way an open change would. Ideation
    // projects count too: an initiative whose shipped work is done but whose next
    // wave is being formed is parked, not finished.
    const unstarted = (group.projectIds || []).some((id) => {
      const project = PROJECTS_BY_ID[id];
      return project && project.status !== "closed" && !changes.some((c) => c.project_id === id);
    });
    if (changes.length && !open.length && !unstarted) return "completed";
    return "inactive";
  }

  /* Whether the Show filter draws this section. Its own state matching is the normal
     case; a section whose state does NOT match still renders as a pass-through when a
     descendant's does - the filter counts every depth, so every section it counts must
     be reachable, and hiding an active parent must not orphan the inactive
     sub-products inside it. */
  function groupVisible(group) {
    if (!groupSearchVisible(group)) return false;
    if (visibleStates.has(groupState(group))) return true;
    return (group.subgroups || []).some(groupVisible);
  }

  /* Whether the search leaves this section anything to say: its own title, a change
     that survived the filter (`changes` is pre-filtered at grouping time), a declared
     project whose title or epic key matches (empty of changes, it is still a findable
     artifact), or a descendant with any of those - the same pass-through rule the
     state filter keeps, so a matching sub-product is never orphaned by its parent. */
  function groupSearchVisible(group) {
    if (!searchActive()) return true;
    if (matchesSearch(group.title)) return true;
    if (groupChanges(group).length) return true;
    if ((group.projectIds || []).some((id) => projectMatchesSearch(PROJECTS_BY_ID[id]))) return true;
    return (group.subgroups || []).some(groupSearchVisible);
  }

  /* Counts by state, one walk for both consumers: the filter buttons count every
     section (visible or not), the hidden-note counts only what the filter is actually
     hiding - and stops descending there, because a hidden parent hides its children
     as a family, and "5 hidden" for one folded-away subtree would read as five
     separate disappearances. A pass-through parent is on screen, so it is never
     "hidden" - the walk just continues past it looking for children that are. */
  function stateCounts(groups, { hiddenOnly = false } = {}) {
    const counts = { active: 0, inactive: 0, completed: 0 };
    const walk = (list) => {
      for (const group of list) {
        if (hiddenOnly && groupVisible(group)) { walk(group.subgroups || []); continue; }
        counts[groupState(group)] += 1;
        if (hiddenOnly) continue;
        walk(group.subgroups || []);
      }
    };
    walk(groups);
    return counts;
  }

  /* The one line that answers "where did my product go" without leaving the page.
     Null when the filter is hiding nothing, so it costs no space on a full board. */
  function hiddenNote(groups, className) {
    const counts = stateCounts(groups, { hiddenOnly: true });
    const parts = STATE_VALUES
      .filter((s) => counts[s])
      .map((s) => `${counts[s]} ${STATE_META[s].label.toLowerCase()}`);
    if (!parts.length) return null;
    const kind = GROUP_KIND_WORD[groupBy];
    const total = STATE_VALUES.reduce((n, s) => n + counts[s], 0);
    return el("div", className,
      `${parts.join(", ")} ${total === 1 ? kind : kind + "s"} hidden — ` +
      (searchActive() ? "by the search or the Show filter in the nav." : "use the Show filter in the nav."));
  }

  /* The sections as a flat sequence with depth, for the timeline - it draws rows on one
     shared axis, so nesting is indentation there rather than a box inside a box. A
     folded parent takes its sub-products with it: they are inside it, so they fold with
     it rather than being left behind at the top level with nothing above them. */
  function flatGroups(groups = currentGroups(), depth = 0) {
    const out = [];
    for (const group of groups) {
      // The Show filter applies at every depth - but through groupVisible, so a
      // filtered-out parent still appears when something inside it matches.
      if (!groupVisible(group)) continue;
      out.push({ group, depth });
      if (!isCollapsed(group.key)) out.push(...flatGroups(group.subgroups || [], depth + 1));
    }
    return out;
  }

  /* Mirrors portfolio.group_changes_by_initiative on the server (see
     /roadmap/by-initiative). Done client-side so the grouping re-computes instantly on
     websocket events instead of refetching the whole board on every change made
     anywhere. Every change appears exactly once, and anything the tree doesn't reach
     lands in one trailing "Unaligned" group rather than disappearing. */
  function groupsByInitiative() {
    const initiativeOf = (change) => {
      const project = PROJECTS_BY_ID[change.project_id];
      return project && project.initiative_id ? project.initiative_id : null;
    };

    const buckets = new Map();
    for (const change of searchFilter(allChanges())) {
      const key = initiativeOf(change);
      if (!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push(change);
    }

    /* The projects bucketed the same way, in one pass. Asking each initiative to filter
       the whole project list for its own is the same answer at a cost that squares with
       the size of the portfolio, and this grouping runs on every render. */
    const projectsByInitiative = new Map();
    const looseProjects = [];
    for (const project of PORTFOLIO.projects) {
      if (!project.initiative_id) { looseProjects.push(project); continue; }
      const list = projectsByInitiative.get(project.initiative_id);
      if (list) list.push(project); else projectsByInitiative.set(project.initiative_id, [project]);
    }

    const groups = PORTFOLIO.initiatives.map((initiative) => {
      const changes = buckets.get(initiative.id) || [];
      const flags = [];
      if (initiative.is_maintenance) flags.push(["always open", false]);
      if (initiative.status === "closed") flags.push(["closed", false]);
      // Derived server-side (portfolio.initiative_in_ideation): every real project
      // under it is an idea, so the absence of changes is expected, not neglect.
      if (initiative.in_ideation) flags.push(["in ideation", "ideation"]);
      // The product spread is the point of this grouping: it is what a per-product
      // board structurally cannot show.
      const products = new Set(changes.map((c) => c.product));
      if (products.size > 1) flags.push([`${products.size} products`, false]);
      const projects = projectsByInitiative.get(initiative.id) || [];
      return {
        key: `initiative:${initiative.id}`,
        kind: "initiative",
        title: initiative.title,
        description: initiative.description || "",
        flags,
        changes,
        omit: {},
        // An initiative can span products, so it names none - each project row works
        // out its own destination from the changes it holds.
        product: products.size === 1 ? [...products][0] : null,
        projectIds: projects.map((p) => p.id),
        // For the sort below: within one activity state, closed initiatives sink
        // below open ones. A fact of its own, not read back out of the flags.
        closed: initiative.status === "closed",
        // For computeGroupState: ideation + recent session activity reads active.
        inIdeation: !!initiative.in_ideation,
      };
    });

    const unaligned = buckets.get(null) || [];
    // Projects with no initiative belong in the trailing group whether or not anything
    // has been raised against them - an unaligned project is exactly the thing this
    // section exists to make visible. (Collected in the pass above.)
    if (unaligned.length || looseProjects.length || !groups.length) {
      groups.push({
        key: "initiative:none",
        kind: "initiative",
        title: "Unaligned",
        flags: [["no initiative", true]],
        changes: unaligned,
        omit: {},
        product: null,
        projectIds: looseProjects.map((p) => p.id),
      });
    }
    return groups;
  }

  /* ---- the person lens ------------------------------------------------------------

     One section per person who is on something, in load order - heaviest first, so the
     top of the board is whoever is carrying the most. Work nobody is on trails at the
     end as its own section, whatever its size: it is a pile to hand out rather than
     somebody's load, and on most boards it is the largest thing here.

     A person with NO changes gets no section. The directory holds everybody either
     tracker ever mentioned - hundreds, on a real instance - and a board that listed them
     all would be mostly empty headings. Who has room is the load table's question (see
     loadRows, which does show the zeroes) rather than the board's.

     No `projectIds`: a person does not own projects, so the rows under a person section
     are derived from the changes actually there - the same rule a product section uses. */
  function groupsByPerson() {
    const buckets = new Map();
    for (const change of searchFilter(allChanges())) {
      const id = assignedTo(change).person_id || null;
      if (!buckets.has(id)) buckets.set(id, []);
      buckets.get(id).push(change);
    }

    const groups = [];
    for (const person of PEOPLE) {
      const changes = buckets.get(person.id);
      if (!changes || !changes.length) continue;
      const flags = [];
      // Retired, but still holding work - which is exactly the thing worth flagging: it
      // has to go somewhere. See people.PERSON_STATUSES.
      if (person.status !== "active") flags.push(["inactive", true]);
      const products = new Set(changes.map((c) => c.product));
      // The spread is what a per-product board structurally cannot show for a person:
      // somebody with six open changes across four boards is stretched in a way six on
      // one board is not.
      if (products.size > 1) flags.push([`${products.size} products`, false]);
      const overdue = changes.filter((c) => isOutstanding(c) && c.is_overdue).length;
      if (overdue) flags.push([`${overdue} overdue`, true]);
      groups.push({
        key: `person:${person.id}`,
        kind: "person",
        title: person.name,
        // The heading's ⓘ - where they are known, since a name shared by two trackers
        // is the thing somebody will want to check before reassigning anything.
        description: personIdentityNote(person),
        flags,
        changes,
        // A person spans products and projects, so the cards keep both chips - but not
        // the person chip, which the heading already is.
        omit: { person: true },
        product: products.size === 1 ? [...products][0] : null,
        projectIds: null,
      });
    }
    // Heaviest first. Open changes, not all of them: a person whose entire load shipped
    // last quarter is not the busiest person on the board.
    groups.sort((a, b) => {
      const open = (g) => g.changes.filter(isOutstanding).length;
      return open(b) - open(a) || a.title.localeCompare(b.title);
    });

    const nobody = buckets.get(null) || [];
    // Shown even when empty on an otherwise empty board, for the same reason the
    // initiative lens keeps its trailing group: a board with no sections at all reads
    // as broken rather than as a board with nothing on it.
    if (nobody.length || !groups.length) {
      groups.push({
        key: "person:none",
        kind: "person",
        title: "Nobody assigned",
        flags: [["unassigned", true]],
        changes: nobody,
        omit: {},
        product: null,
        projectIds: null,
      });
    }
    return groups;
  }

  /* Where a person is known, for the heading's ⓘ. Says which trackers spell them which
     way, because a wrongly merged pair of identities is invisible until somebody reads
     exactly this - and the fix (split them apart) lives on the People page. */
  function personIdentityNote(person) {
    const parts = [];
    if (person.email) parts.push(person.email);
    for (const identity of person.identities || []) {
      const label = trackerLabel(identity.tracker_id);
      parts.push(`${label}: ${identity.display || identity.key}`);
    }
    if (person.source === "local" && !(person.identities || []).length) {
      parts.push("added here — no tracker knows this person");
    }
    return parts.join(" · ");
  }

  /* What is moving first, then what is parked, then what is finished - the same order
     at every depth, so the top of any list is always the work being run right now.
     Within one state, whatever is CLOSED sinks below what is still open: two parked
     initiatives are not the same thing when one of them somebody has already called
     done, and "inactive but still ours" reads wrong sitting under a shelf of legacy.
     (Products are never closed, so the tiebreak is a no-op in the product lens.)
     Stable beyond that, so remaining ties keep the taxonomy's (or the portfolio's)
     own order - the initiative lens's trailing "Unaligned" group stays behind the
     open initiatives that share its state. */
  const STATE_RANK = { active: 0, inactive: 1, completed: 2 };
  function sortGroupsByState(groups) {
    for (const group of groups) sortGroupsByState(group.subgroups || []);
    // groupState walks the whole subtree, so it is taken once per group here rather
    // than on every comparison the sort makes.
    const rank = new Map(groups.map((g) => [g.key, STATE_RANK[groupState(g)] * 2 + (g.closed ? 1 : 0)]));
    groups.sort((a, b) => rank.get(a.key) - rank.get(b.key));
    return groups;
  }

  /* The sections are a pure function of the work model and the lens, and building them
     walks every change on the board - so they are built once and reused until the data
     underneath them moves. renderAll() is that moment: every path that can change the
     model (a websocket event, an optimistic drag, a refetch) ends there, so clearing the
     cache at the top of it is the whole invalidation rule.

     What this buys is the chrome: folding one section asks for the sections again to
     re-label the nav's collapse-all button, and the Show filter asks a second time for
     its counts. Regrouping the entire board twice on every fold is what made a click on
     a heading feel slow on a board of any size. */
  let groupsCache = null;

  function invalidateGroups() {
    groupsCache = null;
  }

  function currentGroups() {
    if (!groupsCache) {
      // The person lens brings its own order (heaviest load first), which the
      // by-activity sort would overwrite - so it is the one lens that keeps it.
      groupsCache = groupBy === "person"
        ? groupsByPerson()
        : sortGroupsByState(groupBy === "initiative" ? groupsByInitiative() : groupsByProduct());
    }
    return groupsCache;
  }

  /* ---- the project level ----------------------------------------------------------

     The section's first level. A row is
       { key, project, title, changes, flags, omit, addTo, roll }
     where `project` is null for the synthetic row holding changes that belong to no
     project - shown, never hidden, because a change that fell out of the work model is
     the one you most need to see.

     `key` is scoped to the group, so the same project appearing under two products
     folds independently: opening it on one board should not open it on the other. */

  /* Whether a change is still work somebody has to do.

     Not `status !== "done"`. A change whose ticket the tracker resolved won't-do is
     SETTLED - the decision was "not this", which is an answer. The status mirror
     deliberately refuses to mark those done (declined is not delivered) and the won't-do
     removal only deletes the ones nobody had touched, so a declined change a human had
     filed into now/next keeps `pending` for good. Counted as open it pinned its project
     on the board permanently: closed, fully declined, and unable to ever become history.

     `ticket.is_wont_do` comes off the wire rather than being re-derived here - the
     spelling lives on Ticket in trackers.py and a second one in JavaScript is exactly
     the disagreement that property's docstring warns about. */
  function isOutstanding(change) {
    return change.status !== "done" && !(change.ticket && change.ticket.is_wont_do);
  }

  function rollup(changes) {
    const done = changes.filter((c) => c.status === "done");
    const live = changes.filter((c) => c.status === "in_progress" && isOutstanding(c));
    const open = changes.filter(isOutstanding);
    const declined = changes.filter((c) => c.status !== "done" && !isOutstanding(c));
    const overdue = open.filter((c) => c.is_overdue);
    // The window the project actually runs over, from whatever dates its changes
    // carry. Undated changes contribute nothing rather than collapsing it to today.
    let from = null;
    let to = null;
    for (const c of changes) {
      for (const iso of [c.start_at, c.target_at]) {
        const ms = dateMs(iso);
        if (ms == null) continue;
        if (from == null || ms < from) from = ms;
        if (to == null || ms > to) to = ms;
      }
    }
    return {
      total: changes.length,
      done: done.length,
      live: live.length,
      pending: open.length - live.length,
      open: open.length,
      declined: declined.length,
      overdue: overdue.length,
      now: open.filter((c) => c.bucket === "now").length,
      from,
      to,
    };
  }

  function meter(roll) {
    const node = el("div", "meter");
    node.setAttribute("aria-hidden", "true"); // the counts beside it carry the same facts
    if (!roll.total) {
      node.appendChild(el("span", "seg empty"));
      return node;
    }
    /* Declined gets its own segment rather than being folded into pending or dropped.
       Dropped, the bar would read as pure progress on a project that abandoned half its
       work - the segments flex-grow into a fixed width, so a missing one is invisible
       rather than short. Inert-coloured, because it is neither done nor waiting. */
    for (const [name, count] of [
      ["done", roll.done], ["in_progress", roll.live],
      ["pending", roll.pending], ["declined", roll.declined],
    ]) {
      if (!count) continue;
      const seg = el("span", `seg ${name}`);
      seg.style.flex = `${count} 1 0`;
      node.appendChild(seg);
    }
    node.title = `${roll.done} shipped · ${roll.live} in progress · ${roll.pending} not started`
      + (roll.declined ? ` · ${roll.declined} declined` : "");
    return node;
  }

  function projectRows(group, changes) {
    const byProject = new Map();
    for (const change of changes) {
      const id = PROJECTS_BY_ID[change.project_id] ? change.project_id : null;
      if (!byProject.has(id)) byProject.set(id, []);
      byProject.get(id).push(change);
    }

    // The section's declared projects first, in the portfolio's own order, then
    // anything that landed here without being on that list - a change moved onto a
    // project belonging to another initiative must still be drawn somewhere.
    const ids = group.projectIds
      ? group.projectIds.filter((id) => PROJECTS_BY_ID[id])
      : PORTFOLIO.projects.filter((p) => byProject.has(p.id)).map((p) => p.id);
    const listed = new Set(ids);
    for (const id of byProject.keys()) {
      if (id !== null && !listed.has(id)) { listed.add(id); ids.push(id); }
    }

    const row = (project, rowChanges) => {
      const flags = [];
      if (project && project.is_catch_all) flags.push(["catch-all", false]);
      if (project && project.status === "closed") flags.push(["closed", false]);
      // The marked state: delivering projects wear no phase chip, an idea does.
      if (project && project.status === "ideation") flags.push(["ideation", "ideation"]);
      if (project && project.is_unaligned && groupBy === "product") flags.push(["no initiative", true]);
      const products = new Set(rowChanges.map((c) => c.product));
      if (!group.product && products.size > 1) flags.push([`${products.size} products`, false]);

      /* Where a "+" in this row would put a change. The project is known by
         construction; the product is the section's when it has one, the changes' when
         they agree on one, and the deployment's when it only has one board at all.
         Anything else is a guess, so the row shows no "+" instead. */
      const productIds = Object.keys(PRODUCTS);
      const product = group.product
        || (products.size === 1 ? [...products][0] : null)
        || (productIds.length === 1 ? productIds[0] : null);

      return {
        key: `${group.key}/project:${project ? project.id : "none"}`,
        project,
        title: project ? project.title : "No project",
        changes: rowChanges,
        flags,
        // The row already names the project, so its changes don't repeat it - the same
        // trick the section head plays with the product.
        omit: { ...group.omit, project: true },
        addTo: product ? { product, projectId: project ? project.id : null } : null,
        roll: rollup(rowChanges),
      };
    };

    let rows = ids.map((id) => row(PROJECTS_BY_ID[id], byProject.get(id) || []));
    if (byProject.has(null)) rows.push(row(null, byProject.get(null)));
    /* Under a search, a declared project holding nothing that matched is noise unless
       its own title or epic key is what matched - the changes are already filtered
       upstream, so an empty row here has nothing to say about the query. */
    if (searchActive()) {
      rows = rows.filter((r) => r.changes.length || projectMatchesSearch(r.project));
    }
    /* The same active / inactive / completed order the sections themselves keep, one
       level down: a row is active when it holds open Now/Next work, completed when it
       is history (see isHistoryRow), parked otherwise - and within one state a closed
       project sinks below the open ones, the same tiebreak sortGroupsByState applies.
       Stable beyond that, so remaining ties keep the portfolio's own order and the
       "No project" row stays last among its peers. History rows land at the end either
       way - both views already split them off behind the "show closed" toggle. */
    const rowRank = (r) =>
      (r.changes.some((c) => isOutstanding(c) && (c.bucket === "now" || c.bucket === "next"))
        ? 0 : isHistoryRow(r) ? 2 : 1) * 2
      + (r.project && r.project.status === "closed" ? 1 : 0);
    const rank = new Map(rows.map((r) => [r.key, rowRank(r)]));
    return rows.sort((a, b) => rank.get(a.key) - rank.get(b.key));
  }

  /* A closed project with nothing left open is history: true about the section but not
     part of its plan, so both views fold it away behind a "show closed" toggle. A
     closed project still holding open changes is NOT history - work stranded in a
     project somebody closed is exactly the kind of wrong the board exists to show, so
     it stays on the board wearing its "closed" chip. */
  function isHistoryRow(row) {
    return !!row.project
      && row.project.status === "closed"
      && !row.changes.some(isOutstanding);
  }

  // ---- the now / next / later view ----

  /* ---- dragging a change between horizons -----------------------------------------
     The other drag the board supports, and the cheaper of the two: `bucket` is a
     purely local field (no tracker has a horizon), so a drop is one PATCH on the
     change and Jira/ADO never hears about it. Scoped to the three lanes of the card's
     OWN project row: dropping into another project's lane would be a re-homing, which
     is a different decision with its own controls on the open card. */
  let draggingChange = null; // { item, rowKey }

  function wireChangeDrag(card, main, item, rowKey) {
    // The title strip, not the whole card: an open card body is full of controls.
    main.draggable = true;
    main.addEventListener("dragstart", (event) => {
      draggingChange = { item, rowKey };
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", item.title);
      card.classList.add("dragging");
    });
    main.addEventListener("dragend", () => {
      draggingChange = null;
      card.classList.remove("dragging");
      for (const l of document.querySelectorAll(".lane.drop-ok")) l.classList.remove("drop-ok");
    });
  }

  function wireLaneDrop(lane, rowKey, bucket) {
    const accepts = () =>
      !!draggingChange && draggingChange.rowKey === rowKey && draggingChange.item.bucket !== bucket;
    lane.addEventListener("dragover", (event) => {
      if (!accepts()) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      lane.classList.add("drop-ok");
    });
    lane.addEventListener("dragleave", (event) => {
      if (!lane.contains(event.relatedTarget)) lane.classList.remove("drop-ok");
    });
    lane.addEventListener("drop", (event) => {
      lane.classList.remove("drop-ok");
      if (!accepts()) return;
      event.preventDefault();
      const item = draggingChange.item;
      draggingChange = null;
      // Optimistic like the project drag; patchItem's failure path already alerts
      // with the server's reason and reloads the board back to the truth.
      item.bucket = bucket;
      renderAll();
      patchItem(item, { bucket });
    });
  }

  /* The lanes now belong to ONE project rather than to a whole section, so `row` is a
     project row - but the shape it needs ({ changes, omit, addTo }) is the same one a
     group had, and untriaged suggestions have already been lifted out of it by
     renderBoard. */
  function renderLanes(row, container) {
    /* `status !== "done"`, NOT isOutstanding - the one place that distinction is
       deliberate. A declined change is discounted from every count on the board, but it
       is still a card a human filed into a horizon, and it will never appear under
       "recently shipped" either (that reads `status === "done"`). Excluded here it would
       simply vanish. So the lane keeps drawing it and metaChips marks it declined, which
       is what stops the lane and the tally that discounted it from reading as a
       contradiction. */
    const open = row.changes.filter((i) => i.status !== "done");

    const lanes = el("div", "lanes");
    for (const [value, label] of BUCKETS) {
      const items = open
        .filter((i) => i.bucket === value)
        // Soonest commitment first, undated work after it - so a date changes what you
        // see in this view too, not only on the timeline. ISO dates sort as strings.
        .sort((a, b) =>
          (a.target_at ? 0 : 1) - (b.target_at ? 0 : 1)
          || (a.target_at || "").localeCompare(b.target_at || "")
          || a.created_at - b.created_at);
      const lane = el("div", "lane");

      const head = el("div", "lane-head");
      head.appendChild(el("h3", null, label));
      head.appendChild(el("span", "n", String(items.length)));
      lane.appendChild(head);

      if (row.addTo) {
        const add = el("button", "add-btn", "+");
        add.type = "button";
        add.title = `Add a change to ${label}`;
        // Three of these per project row, each a form with its own system picker - built
        // when somebody actually goes to add something, and kept afterwards so a
        // half-typed change survives closing the form.
        let form = null;
        add.addEventListener("click", () => {
          if (!form) {
            form = addForm(row.addTo.product, value, row.addTo.projectId);
            lane.insertBefore(form, head.nextSibling);
          }
          form.classList.toggle("open");
        });
        head.appendChild(add);
      }

      if (!items.length) lane.appendChild(el("div", "lane-empty", "—"));
      for (const item of items) {
        const card = itemCard(item, row.omit);
        wireChangeDrag(card, card.querySelector(".card-main"), item, row.key);
        lane.appendChild(card);
      }
      wireLaneDrop(lane, row.key, value);
      lanes.appendChild(lane);
    }
    container.appendChild(lanes);

    const shipped = row.changes
      .filter((i) => i.status === "done")
      .sort((a, b) => (b.shipped_at ?? b.updated_at) - (a.shipped_at ?? a.updated_at))
      .slice(0, 8);
    if (shipped.length) {
      const details = el("details", "shipped");
      details.appendChild(el("summary", null, `Recently shipped (${shipped.length})`));
      const list = el("div", "shipped-list");
      for (const item of shipped) {
        const line = el("div", "shipped-item");
        line.appendChild(el("span", "when", relativeTime(item.shipped_at ?? item.updated_at)));
        line.appendChild(el("span", null, item.title));
        list.appendChild(line);
      }
      details.appendChild(list);
      container.appendChild(details);
    }
  }

  /* ---- dragging a project between initiatives (initiative lens only) --------------
     The one re-parenting the model supports as a drag: a project has exactly one
     initiative_id, so a drop is a single PATCH and nothing else moves - its changes
     keep their products, buckets and tickets. The product lens deliberately has no
     drag: a project has no product to move between (see projectRows), and a change's
     board is a different operation with its own controls. Catch-all rows never drag -
     they are auto-created plumbing, and the server refuses them anyway. */
  let draggingProjectId = null;

  function draggableProject(row) {
    return groupBy === "initiative" && row.project
      && !row.project.is_catch_all && !row.project.catch_all_for_initiative;
  }

  function wireProjectDrag(node, head, project) {
    // The head, not the whole row: the open body is full of its own controls, and a
    // card that starts a drag when you meant to select a title reads as broken.
    head.draggable = true;
    head.addEventListener("dragstart", (event) => {
      draggingProjectId = project.id;
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", project.title);
      node.classList.add("dragging");
    });
    head.addEventListener("dragend", () => {
      draggingProjectId = null;
      node.classList.remove("dragging");
      for (const s of document.querySelectorAll(".group.drop-ok")) s.classList.remove("drop-ok");
    });
  }

  function wireInitiativeDrop(section, initiativeId) {
    // Dropping where the project already lives is a no-op, so it is not a target.
    const accepts = () => {
      const project = draggingProjectId ? PROJECTS_BY_ID[draggingProjectId] : null;
      return !!project && (project.initiative_id || null) !== initiativeId;
    };
    section.addEventListener("dragover", (event) => {
      if (!accepts()) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      section.classList.add("drop-ok");
    });
    section.addEventListener("dragleave", (event) => {
      if (!section.contains(event.relatedTarget)) section.classList.remove("drop-ok");
    });
    section.addEventListener("drop", (event) => {
      section.classList.remove("drop-ok");
      if (!accepts()) return;
      event.preventDefault();
      moveProjectToInitiative(draggingProjectId, initiativeId);
      draggingProjectId = null;
    });
  }

  function moveProjectToInitiative(projectId, initiativeId) {
    const project = PROJECTS_BY_ID[projectId];
    if (!project) return;
    // Optimistic, same contract as patchItem: the board redraws from local state now,
    // the server's portfolio_changed broadcast confirms it for everyone else, and a
    // refusal rolls back to the truth with the reason on screen.
    const previous = project.initiative_id;
    project.initiative_id = initiativeId;
    project.is_unaligned = !initiativeId;
    renderAll();
    fetch(`/portfolio/projects/${projectId}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initiative_id: initiativeId || "" }),
    })
      .then((r) => {
        if (r.ok) return;
        return r.json().catch(() => ({})).then((body) => {
          project.initiative_id = previous;
          project.is_unaligned = !previous;
          alert(body.detail || "That project could not be moved.");
          loadBoard();
        });
      })
      .catch(() => {
        project.initiative_id = previous;
        project.is_unaligned = !previous;
        loadBoard();
      });
  }

  /* One project row: the strategic line, with the whole Now / Next / Later board for
     that project folded inside it. */
  function projectNode(row) {
    // Open while a search is on, like the sections (see isCollapsed): the cards are
    // what matched, and a filter that only shows you closed rows hides its own answer.
    const isOpen = searchActive() || openProjects.has(row.key);
    const node = el("article", "project" + (isOpen ? " open" : ""));

    const head = el("button", "project-head");
    head.type = "button";
    head.setAttribute("aria-expanded", String(isOpen));
    head.appendChild(el("span", "chevron", "▾"));
    head.appendChild(kindIcon(row.project ? "project" : "loose"));
    head.appendChild(el("span", "project-name" + (row.project ? "" : " loose"), row.title));
    for (const [text, warn] of row.flags) head.appendChild(chip(text, warn === true ? "warn" : warn || null));
    // The epic this project is tracked as - or the pending-upload chip when it only
    // exists locally (see projectEpicNode).
    const epic = projectEpicNode(row.project);
    if (epic) head.appendChild(epic);
    /* Finished-looking but still open. Beside the epic badge on purpose: the two
       together are the whole argument for closing it - "every change shipped, and this
       is the epic that says so". The blocked case is a warn chip rather than an offer,
       because the number it carries is the reason not to trust the row's own shipped
       count. Both are suppressed on a closed row, where they would state the obvious. */
    const candidate = row.project && row.project.status !== "closed"
      ? closeCandidate(row.project.id) : null;
    if (candidate && candidate.reason === "blocked") {
      head.appendChild(chip(
        `${candidate.tracker_open} open in the tracker`, "warn"));
    } else if (candidate) {
      const ready = chip("ready to close", "ready");
      ready.title = candidate.reason === "tracker"
        ? `Every change shipped and the epic is ${candidate.epic_state}.`
        : "Every change here is settled" + (candidate.epic_state
          ? `, though the epic is still ${candidate.epic_state}.` : ".");
      head.appendChild(ready);
    }
    // The one flag that isn't about the project's shape but about its health, so it is
    // the one that gets a fill.
    if (row.roll.overdue) head.appendChild(chip(`${row.roll.overdue} overdue`, "late"));
    if (row.roll.from != null) {
      head.appendChild(chip(
        row.roll.from === row.roll.to
          ? dateLabelMs(row.roll.from)
          : `${dateLabelMs(row.roll.from)} → ${dateLabelMs(row.roll.to)}`,
        "dates"));
    }

    const stats = el("div", "project-stats");
    stats.appendChild(meter(row.roll));
    if (row.roll.total) {
      stats.appendChild(el("span", null, `${row.roll.done}/${row.roll.total} shipped`));
      if (row.roll.live) stats.appendChild(el("span", "live", `${row.roll.live} in progress`));
      stats.appendChild(el("span", null, `${row.roll.now} now`));
    } else if (row.project && row.project.status === "ideation") {
      // An ideation row's right side answers a different question: not "how much has
      // shipped" (nothing, by definition - "0 changes" would read as dead) but "is
      // anyone thinking about this". Session turns attributed to the project are that
      // evidence, already recorded; see projectActivity.
      const act = projectActivity(row.project.id);
      if (act && act.recent_sessions) {
        stats.appendChild(el("span", "ideation",
          `${act.recent_sessions} session${act.recent_sessions === 1 ? "" : "s"} · touched ${relativeTime(act.last_at)}`));
      } else if (act && act.last_at) {
        stats.appendChild(el("span", null, `last touched ${relativeTime(act.last_at)}`));
      } else {
        stats.appendChild(el("span", null, "no activity yet"));
      }
    } else {
      stats.appendChild(el("span", null, "no changes yet"));
    }
    head.appendChild(stats);

    const body = el("div", "project-body");
    /* Built the first time the row is opened, and kept from then on - so a card the
       user opened inside it survives folding the row, which is what building it eagerly
       used to buy. The row's own strip already carries the counts, the meter and the
       dates, so a folded row needs none of this. */
    const fillBody = buildOnce(() => {
      if (!row.roll.total && !row.addTo) {
        body.appendChild(el("div", "project-empty", "Nothing raised against this project yet."));
      } else {
        renderLanes(row, body);
      }
    });

    head.addEventListener("click", () => {
      const nowOpen = !openProjects.has(row.key);
      if (nowOpen) { openProjects.add(row.key); fillBody(); } else openProjects.delete(row.key);
      node.classList.toggle("open", nowOpen);
      head.setAttribute("aria-expanded", String(nowOpen));
      persistOpenProjects();
    });
    if (draggableProject(row)) wireProjectDrag(node, head, row.project);
    node.appendChild(head);

    node.appendChild(body);
    if (isOpen) fillBody();
    return node;
  }

  /* One section, with its sub-product sections drawn inside its own body. The
     sub-products come FIRST and the parent's own project rows follow, so a parent
     reads as "here is the family below me, and here is what I run directly" - the
     children are boards in their own right and the parent's loose rows are the
     residue, not the headline. */
  function groupSection(group, depth) {
    const section = el("section", "group" + (depth ? " sub" : ""));
    if (isCollapsed(group.key)) section.classList.add("collapsed");
    // Every initiative section takes drops, folded or not - the heading is enough of a
    // target - and "Unaligned" (initiative:none) is one too: dropping there is how a
    // project is deliberately detached.
    if (groupBy === "initiative" && group.kind === "initiative") {
      wireInitiativeDrop(section, group.key === "initiative:none" ? null : group.key.slice("initiative:".length));
    }

    const head = el("button", "group-head");
    head.type = "button";
    head.setAttribute("aria-expanded", String(!isCollapsed(group.key)));
    head.appendChild(el("span", "chevron", "▾"));
    head.appendChild(kindIcon(groupKind(group, depth)));
    head.appendChild(el("h2", null, group.title));
    head.appendChild(stateIcon(groupState(group)));
    // The initiative's description on demand: an ⓘ in the heading toggles it open
    // below. A span with a button role rather than a button, because the heading
    // already IS a button and nesting one inside it is invalid HTML.
    if (group.description) {
      const info = el("span", "info" + (revealDesc.has(group.key) ? " open" : ""), "ⓘ");
      info.setAttribute("role", "button");
      info.tabIndex = 0;
      info.title = revealDesc.has(group.key) ? "Hide description" : "Show description";
      const flip = (event) => {
        event.stopPropagation();
        if (revealDesc.has(group.key)) revealDesc.delete(group.key);
        else revealDesc.add(group.key);
        renderAll();
      };
      info.addEventListener("click", flip);
      info.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") { event.preventDefault(); flip(event); }
      });
      head.appendChild(info);
    }
    // Owner/team as the heading's tooltip: context on demand, not a row of chrome.
    if (group.product && PRODUCT_META[group.product]) {
      const m = PRODUCT_META[group.product];
      const facts = [m.owner && `Owner: ${m.owner}`, m.team && `Team: ${m.team}`,
                     m.description].filter(Boolean).join(" · ");
      if (facts) head.title = facts;
    }
    // A flag's second slot is `true` for the amber warn look, or a class name for a
    // styled chip of its own (see "in ideation").
    for (const [text, warn] of group.flags) head.appendChild(chip(text, warn === true ? "warn" : warn || null));

    /* Untriaged cross-product suggestions are lifted to the section, not filed under
       a project: nobody has accepted them onto this board yet, so claiming they are
       part of a project's plan would be putting them in the plan by drawing them. */
    const suggestions = group.changes.filter(
      (i) => isOutstanding(i) && i.origin_product !== i.product && !i.triaged);
    const suggested = new Set(suggestions.map((i) => i.id));
    const planned = group.changes.filter((i) => !suggested.has(i.id));
    const rows = projectRows(group, planned);
    // The plan and the history, split once and used everywhere below: the current rows
    // are what the section draws, the closed ones wait behind the toggle.
    const currentRows = rows.filter((r) => !isHistoryRow(r));
    const closedRows = rows.filter(isHistoryRow);

    const open = planned.filter(isOutstanding);
    const live = open.filter((i) => i.status === "in_progress").length;
    const subgroups = group.subgroups || [];
    const tally = el("div", "tally");
    // Projects first: the section's headline is now how many bets it is running, and
    // the change counts are the size of them. The closed count rides along because a
    // folded heading is all most sections ever show - it is the summary, so it has to
    // say the history exists even though the rows below hide it.
    tally.appendChild(el("span", null, `${currentRows.length} project${currentRows.length === 1 ? "" : "s"}`));
    if (closedRows.length) tally.appendChild(el("span", null, `${closedRows.length} closed`));
    tally.appendChild(el("span", null, `${open.length} open`));
    if (live) tally.appendChild(el("span", "live", `${live} in progress`));
    // Folded, the heading is all a section says - so ideas being formed inside it
    // have to be audible here, the same way in-progress work is.
    const ideating = currentRows.filter((r) => r.project && r.project.status === "ideation").length;
    if (ideating) tally.appendChild(el("span", "ideation", `${ideating} in ideation`));
    /* Two counts about closing, and they are not the same fact.
