<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PM Studio — Sessions</title>
<link rel="stylesheet" href="/static/nav.css" />
<script src="/static/nav.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink-primary: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --border: rgba(11, 11, 11, 0.10);
    --status-active: #0ca30c;
    --status-merging: #b8860b;
    --status-merged: #2a78d6;
    --status-conflict: #d03b3b;
    --status-archived: #898781;
    --accent: #2a78d6;
    --accent-fg: #ffffff;
    /* Live activity (orthogonal to lifecycle status): working uses the active green;
       waiting-for-input is the loud "your move" treatment. */
    --activity-working: #0ca30c;
    --waiting-accent: #c77700;
    --waiting-bg: rgba(199, 119, 0, 0.09);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19;
      --page: #0d0d0d;
      --ink-primary: #ffffff;
      --ink-secondary: #c3c2b7;
      --ink-muted: #898781;
      --border: rgba(255, 255, 255, 0.10);
      --status-active: #0ca30c;
      --status-merging: #d4a72c;
      --status-merged: #3987e5;
      --status-conflict: #e66767;
      --status-archived: #898781;
      --accent: #3987e5;
      --accent-fg: #ffffff;
      --activity-working: #2fce2f;
      --waiting-accent: #e0a33c;
      --waiting-bg: rgba(224, 163, 60, 0.13);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page);
    color: var(--ink-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.2em; margin: 0; }
  header p { margin: 4px 0 0; color: var(--ink-muted); font-size: 0.85em; }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px;
  }
  /* Wraps rather than overflows. A <select> defaults to `min-width: auto`, meaning as wide
     as its longest option - so a row of them sized by their content (an initiative title
     can be a sentence) overflowed `main`'s column to the right instead of shrinking, and on
     a narrower viewport the button left the page entirely. Every control below therefore
     gets an explicit flex basis and `min-width: 0`, which is what lets the row shrink at
     all, and the row wraps to a second line before anything is squashed unreadable. */
  #new-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }
  #new-form input {
    /* Its own full-width row, so the pickers below get the whole column to share. Four
       controls plus the button never fit one 720px line without squeezing the selects to
       where their labels are unreadable - and the free-text field is the one that actually
       benefits from the width. Two deliberate rows beat one cramped row that wraps
       differently depending on how long a deployment's initiative titles happen to be. */
    flex: 1 1 100%;
    min-width: 0;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink-primary);
    font: inherit;
  }
  #new-form select {
    /* An explicit basis, so the longest option's width no longer drives the layout. */
    flex: 1 1 150px;
    min-width: 0;
    max-width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink-primary);
    font: inherit;
    /* A long initiative title is clipped in the closed control rather than widening it;
       the full text is still in the open list and in the `title` tooltip. */
    text-overflow: ellipsis;
  }
  /* The model and mode pickers hold short fixed labels - no reason to give them a share
     of the leftover space the two long-labelled pickers can use. */
  #new-form #new-model,
  #new-form #new-mode { flex: 0 1 auto; }
  /* Both badges follow .goal's one-line-with-ellipsis rule rather than wrapping. Each can
     now hold a long string - an initiative title is a phrase, and the board line lists every
     adopted board - and in the narrow column this card gives them, wrapping turned a 240px
     card into a 420px one stacked a word per line. The full text stays available as the
     element's `title`. */
  .card .product-badge,
  .card .initiative-badge {
    font-size: 0.78em;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .card .product-badge { color: var(--ink-muted); }
  /* The initiative a session works IN, distinct from the board(s) it can write to -
     accented, because for a cross-product session this is the primary scope and the
     product badge is the derived one. */
  .card .initiative-badge { color: var(--accent); }
  #new-form button {
    /* Never shrinks and never wraps its own label: squeezed to fit it broke into
       "+ New / session" two lines high, which dragged the whole row's height with it.
       When the row does wrap, this sits at the end of the last line. */
    flex: 0 0 auto;
    margin-left: auto;
    white-space: nowrap;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-fg);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #new-form button:disabled { opacity: 0.5; cursor: default; }
  #list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
  }
  .card:hover { border-color: var(--accent); }
  .card .link { text-decoration: none; color: inherit; flex: 1; min-width: 0; }
  .card .name { font-weight: 600; }
  .card .goal {
    font-size: 0.82em;
    color: var(--ink-secondary);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .card .branch {
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.8em;
    color: var(--ink-muted);
    margin-top: 2px;
  }
  .card .result-note {
    font-size: 0.78em;
    color: var(--ink-muted);
    margin-top: 4px;
  }
  /* Live activity treatment (separate from the lifecycle status badge on the right). */
  .card.waiting {
    border-left: 4px solid var(--waiting-accent);
    background: var(--waiting-bg);
  }
  .card .activity {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 6px;
    font-size: 0.78em;
    font-weight: 600;
    max-width: 100%;
  }
  .card .activity.working { color: var(--activity-working); }
  .card .activity.waiting { color: var(--waiting-accent); }
  .card .activity .dot {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
    animation: activity-pulse 1.4s ease-in-out infinite;
  }
  .card .activity .activity-detail {
    color: var(--ink-secondary);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  @keyframes activity-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.62); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card .activity .dot { animation: none; }
  }
  .card .actions {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-shrink: 0;
  }
  .card .actions button {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--ink-secondary);
    font: inherit;
    font-size: 0.8em;
    cursor: pointer;
  }
  .card .actions button:hover { border-color: var(--accent); color: var(--accent); }
  .card .actions button:disabled { opacity: 0.5; cursor: default; }
  .card .actions button.terminate:hover { border-color: var(--status-conflict); color: var(--status-conflict); }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8em;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.active { color: var(--status-active); }
  .badge.merging { color: var(--status-merging); }
  .badge.merged { color: var(--status-merged); }
  .badge.conflict { color: var(--status-conflict); }
  .badge.archived { color: var(--status-archived); }
  #toggle-row {
    display: flex;
    justify-content: flex-end;
    margin: -12px 0 16px;
  }
  #toggle-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85em;
    color: var(--ink-secondary);
    cursor: pointer;
    user-select: none;
  }
  .card.archived-row { opacity: 0.55; }
  /* Research/strategy sessions dispatch no dev work; the pill says so at a glance.
     Same shape as the archived flag, but in the accent - it's a capability statement,
     not a lifecycle one. */
  .research-flag-badge {
    font-size: 0.72em;
    font-weight: 600;
    color: var(--accent);
    background: var(--border);
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .archived-flag-badge {
    font-size: 0.72em;
    font-weight: 600;
    color: var(--ink-muted);
    background: var(--border);
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
</style>
</head>
<body>
<!-- Destinations, identity and the flow map all come from the shared nav. What is left
     here is only what this page is. -->
<div id="pm-nav" data-page="sessions"></div>
<header>
  <h1>Sessions</h1>
  <p>Each session is its own PM conversation on its own git branch/worktree - work on several at once, then merge back when ready.</p>
</header>
<main>
  <form id="new-form">
    <input id="new-name" type="text" placeholder="Session name (optional — the PM will auto-title this session)" />
    <select id="new-product"><option value="">General (no specific product)</option></select>
    <!-- Hidden until the deployment actually has initiatives to pick: on an instance not
         using the work model this would be a permanently empty control. -->
    <select id="new-initiative" hidden
            title="Work IN an initiative instead of on one product. Leave the product as General when the initiative spans several - the session finds out which as it goes, and adopts those boards then.">
      <option value="">No initiative</option>
    </select>
    <select id="new-model"></select>
    <select id="new-mode"
            title="Build sessions dispatch dev tasks that change code. Research / strategy sessions can't - the PM researches, specs and plans only, until you switch it to build from its chat header.">
      <option value="build">Build</option>
      <option value="research">Research / strategy</option>
    </select>
    <button id="new-submit" type="submit">+ New session</button>
  </form>
  <div id="toggle-row">
    <label for="show-archived">
      <input id="show-archived" type="checkbox" />
      Show archived
    </label>
  </div>
  <div id="list"></div>
</main>
<script>
  const list = document.getElementById("list");
  const form = document.getElementById("new-form");
  const nameInput = document.getElementById("new-name");
  const productSelect = document.getElementById("new-product");
  const initiativeSelect = document.getElementById("new-initiative");
  const modelSelect = document.getElementById("new-model");
  const modeSelect = document.getElementById("new-mode");
  const submitBtn = document.getElementById("new-submit");
  const showArchivedCheckbox = document.getElementById("show-archived");
  let showArchived = false;
  let PRODUCTS = {};
  // child product id -> parent id (see config._parse_products); empty on a flat taxonomy.
  let PRODUCT_PARENTS = {};
  // initiative id -> title, for the picker and the per-card badge. Empty on a deployment
  // that hasn't declared any, which is why the picker starts hidden.
  let INITIATIVES = {};

  // Every product above this one, nearest first ([] for a top-level one). `seen` guards a
  // cyclic taxonomy the same way roadmap.ancestors_of does - the server refuses one at
  // config load, and a hang here would be a blank sessions page.
  function ancestorsOf(id) {
    const chain = [];
    const seen = new Set([id]);
    let cursor = PRODUCT_PARENTS[id];
    while (cursor && !seen.has(cursor)) {
      chain.push(cursor);
      seen.add(cursor);
      cursor = PRODUCT_PARENTS[cursor];
    }
    return chain;
  }

  // "Web App / Auth / SSO" - the full path. A session badge and the picker below both need
  // it: pinning a session to "Billing" is a different decision depending on whose it is.
  function productPathLabel(id) {
    const path = [...ancestorsOf(id).reverse(), id];
    return path.map((p) => PRODUCTS[p] ?? p).join(" / ");
  }

  fetch("/roadmap/data")
    .then((r) => r.json())
    .then((data) => {
      PRODUCTS = data.products || {};
      PRODUCT_PARENTS = data.product_parents || {};
      // PRODUCTS arrives depth first, each product followed by its own descendants, so one
      // pass in order gives a picker that reads as the taxonomy - every product indented
      // under the one it belongs to, rather than an alphabetical soup of every board.
      for (const [id, label] of Object.entries(PRODUCTS)) {
        const opt = document.createElement("option");
        opt.value = id;
        // One EM SPACE per level, not a run of ordinary spaces: browsers collapse leading
        // whitespace inside <option>, so a plain-space indent would draw every level flush.
        const depth = ancestorsOf(id).length;
        opt.textContent = depth ? `${"\u2003".repeat(depth)}↳ ${label}` : label;
        // Screen readers and the closed-select display both get the unambiguous form;
        // the indent is only what the open list uses to show the shape.
        opt.title = productPathLabel(id);
        productSelect.appendChild(opt);
      }
      renderList(); // re-render with product labels now known
    })
    .catch(() => {});

  // Only OPEN initiatives are offered: starting a session in a closed one is a mistake
  // every time, and an existing session pinned to one is reported rather than hidden (see
  // server.py's _session_scope_report).
  fetch("/portfolio/data")
    .then((r) => (r.ok ? r.json() : null))
    .then((data) => {
      if (!data) return;
      for (const initiative of data.initiatives || []) {
        INITIATIVES[initiative.id] = initiative.title;
        if (initiative.status !== "open") continue;
        const opt = document.createElement("option");
        opt.value = initiative.id;
        opt.textContent = initiative.title;
        opt.title = initiative.description || initiative.title;
        initiativeSelect.appendChild(opt);
      }
      if (initiativeSelect.options.length > 1) initiativeSelect.hidden = false;
      renderList(); // re-render with initiative titles now known
    })
    .catch(() => {});

  fetch("/models")
    .then((r) => r.json())
    .then((models) => {
      for (const m of models) {
        const opt = document.createElement("option");
        opt.value = m.id; opt.textContent = m.label;
        modelSelect.appendChild(opt);
      }
    })
    .catch(() => {});

  const STATUS_LABEL = {
    active: "● Active",
    merging: "● Merging…",
    merged: "✓ Merged",
    conflict: "✗ Conflict",
    archived: "○ Archived",
  };

  const pending = new Map(); // session id -> "sync" | "terminate" | "archive" | "unarchive", while a request is in flight

  function resultNote(session) {
    // sync_result never affects status, so surface its outcome separately.
    const sync = session.sync_result;
    if (!sync) return "";
    if (sync.outcome === "failed") return `Last sync failed: ${sync.message ?? "unknown error"}`;
    if (sync.outcome === "auto_resolved") return "Last sync: auto-resolved a conflict from main.";
    if (sync.outcome === "clean") return "Up to date with main.";
    return "";
  }

  // Live activity (working/waiting/idle) is derived server-side and delivered on the
  // session payload; treat a missing/malformed value as idle.
  function activityInfo(session) {
    const a = session.activity;
    if (a && typeof a === "object" && (a.state === "working" || a.state === "waiting")) return a;
    return { state: "idle", reason: null, detail: null };
  }

  function truncate(text, max) {
    return text.length > max ? text.slice(0, max - 1) + "…" : text;
  }

  function buildActivityEl(activity) {
    if (activity.state === "waiting") {
      const el = document.createElement("div");
      el.className = "activity waiting";
      el.innerHTML = `<span aria-hidden="true">⏳</span><span>Waiting for you</span>`;
      return el;
    }
    if (activity.state !== "working") return null;
    const el = document.createElement("div");
    el.className = "activity working";
    const dot = document.createElement("span");
    dot.className = "dot";
    el.appendChild(dot);
    const labelSpan = document.createElement("span");
    if (activity.reason === "dev_task") {
      labelSpan.textContent = "Running dev task";
      el.appendChild(labelSpan);
      if (activity.detail) {
        const detail = document.createElement("span");
        detail.className = "activity-detail";
        detail.textContent = "· " + truncate(activity.detail, 48);
        el.appendChild(detail);
      }
    } else {
      labelSpan.textContent = "Thinking…";
      el.appendChild(labelSpan);
    }
    return el;
  }

  function renderCard(session) {
    const card = document.createElement("div");
    const activity = activityInfo(session);
    const classes = ["card"];
    if (session.archived) classes.push("archived-row");
    if (activity.state === "waiting") classes.push("waiting");
    card.className = classes.join(" ");
    const label = STATUS_LABEL[session.status] ?? session.status;
    const note = resultNote(session);
    const busy = pending.get(session.id);

    // Identity is now the PM-maintained title, falling back to the creation name, then a
    // placeholder. The manual name is no longer shown once a title differs from it.
    const heading = session.title || session.name || "Untitled session";
    const goal = (session.goal || "").trim();

    card.innerHTML = `
      <a class="link" href="/chat/${session.id}">
        <div class="name"></div>
        ${goal ? `<div class="goal"></div>` : ""}
        <div class="branch"></div>
        ${session.initiative_id ? `<div class="initiative-badge"></div>` : ""}
        ${session.product || (session.adopted_products || []).length ? `<div class="product-badge"></div>` : ""}
        ${note ? `<div class="result-note"></div>` : ""}
      </a>
      <div class="actions"></div>
      ${session.mode === "research" ? `<span class="research-flag-badge" title="Research / strategy session - no dev tasks can be dispatched from it.">Research</span>` : ""}
      ${session.archived ? `<span class="archived-flag-badge">Archived</span>` : ""}
      <span class="badge ${session.status}">${label}</span>
    `;
    card.querySelector(".name").textContent = session.is_default ? `${heading} (default)` : heading;
    if (goal) card.querySelector(".goal").textContent = goal;
    const branchEl = card.querySelector(".branch");
    branchEl.textContent = session.branch;
    const activityEl = buildActivityEl(activity);
    if (activityEl) branchEl.insertAdjacentElement("afterend", activityEl);
    if (session.initiative_id) {
      // The id is the fallback, not a blank: a session can outlive the initiative it names
      // (see _session_scope_report), and showing nothing would hide exactly that case.
      const title = INITIATIVES[session.initiative_id];
      const badge = card.querySelector(".initiative-badge");
      badge.textContent = title
        ? `Initiative: ${title}`
        : `Initiative: ${session.initiative_id} (no longer exists)`;
      // The badge is one line with an ellipsis, so the untruncated text lives here.
      badge.title = badge.textContent;
    }
    const adopted = session.adopted_products || [];
    if (session.product || adopted.length) {
      // Pinned board first, then whatever this session adopted as it found out which
      // products its initiative touches - the adopted ones marked, since "can write here"
      // arrived by a different route and is worth being able to see at a glance.
      const boards = [
        ...(session.product ? [productPathLabel(session.product)] : []),
        ...adopted.map((p) => `${productPathLabel(p)} (adopted)`),
      ];
      const badge = card.querySelector(".product-badge");
      badge.textContent = boards.join(" · ");
      badge.title = badge.textContent;
    }
    if (note) card.querySelector(".result-note").textContent = note;

    const actions = card.querySelector(".actions");
    const canAct = !session.is_default && (session.status === "active" || session.status === "conflict");
    if (canAct) {
      const syncBtn = document.createElement("button");
      syncBtn.type = "button";
      syncBtn.textContent = busy === "sync" ? "Syncing…" : "Sync from main";
      syncBtn.disabled = Boolean(busy);
      syncBtn.title = "Merge main into this session so it doesn't drift too far to merge back cleanly later.";
      syncBtn.addEventListener("click", (e) => { e.preventDefault(); startSync(session.id); });
      actions.appendChild(syncBtn);

      const termBtn = document.createElement("button");
      termBtn.type = "button";
      termBtn.className = "terminate";
      termBtn.textContent = busy === "terminate" || session.status === "merging" ? "Terminating…" : "Terminate";
      termBtn.disabled = Boolean(busy) || session.status === "merging";
      termBtn.title = "Merges this session into main, archives its final spec/chat, then removes the worktree.";
      termBtn.addEventListener("click", (e) => {
        e.preventDefault();
        if (!confirm(`Terminate "${heading}"? This merges its work into main (auto-resolving conflicts if needed), archives its final spec/chat, then removes the session. This cannot be undone from the UI.`)) return;
        startTerminate(session.id);
      });
      actions.appendChild(termBtn);
    }

    const archiveBtn = document.createElement("button");
    archiveBtn.type = "button";
    archiveBtn.title = session.archived
      ? "Show this session in the default list again."
      : "Hide this session from the default list.";
    if (session.archived) {
      archiveBtn.textContent = busy === "unarchive" ? "Unarchiving…" : "Unarchive";
      archiveBtn.disabled = Boolean(busy);
      archiveBtn.addEventListener("click", (e) => { e.preventDefault(); startArchiveToggle(session.id, "unarchive"); });
    } else {
      archiveBtn.textContent = busy === "archive" ? "Archiving…" : "Archive";
      archiveBtn.disabled = Boolean(busy);
      archiveBtn.addEventListener("click", (e) => { e.preventDefault(); startArchiveToggle(session.id, "archive"); });
    }
    actions.appendChild(archiveBtn);

    return card;
  }

  function startSync(sessionId) {
    pending.set(sessionId, "sync");
    const session = lastKnown.get(sessionId);
    if (session) upsert(session);
    fetch(`/sessions/${sessionId}/sync`, { method: "POST" })
      .catch(() => {})
      .finally(() => {
        pending.delete(sessionId);
        const current = lastKnown.get(sessionId);
        if (current) upsert(current);
      });
  }

  function startTerminate(sessionId) {
    pending.set(sessionId, "terminate");
    const session = lastKnown.get(sessionId);
    if (session) upsert(session);
    fetch(`/sessions/${sessionId}/terminate`, { method: "POST" })
      .then((r) => {
        if (!r.ok) return r.json().then((body) => { throw new Error(body.detail ?? "terminate failed"); });
        return r.json();
      })
      .then((session) => { lastKnown.set(sessionId, session); upsert(session); })
      .catch((err) => alert(err.message))
      .finally(() => {
        pending.delete(sessionId);
        const current = lastKnown.get(sessionId);
        if (current) upsert(current);
      });
  }

  function startArchiveToggle(sessionId, action) {
    pending.set(sessionId, action);
    const session = lastKnown.get(sessionId);
    if (session) renderList();
    fetch(`/sessions/${sessionId}/${action}`, { method: "POST" })
      .then((r) => {
        if (!r.ok) return r.json().then((body) => { throw new Error(body.detail ?? `${action} failed`); });
        return r.json();
      })
      .then((updated) => { lastKnown.set(sessionId, updated); })
      .catch((err) => alert(err.message))
      .finally(() => {
        pending.delete(sessionId);
        renderList();
      });
  }

  const lastKnown = new Map(); // session id -> last session object seen

  function upsert(session) {
    lastKnown.set(session.id, session);
    renderList();
  }

  // Waiting-for-input cards float to the top, then working, then the rest - preserving
  // created_at order within each group so "who needs me" and "what's live" are scannable.
  function activityRank(session) {
    const state = activityInfo(session).state;
    if (state === "waiting") return 0;
    if (state === "working") return 1;
    return 2;
  }

  function renderList() {
    list.innerHTML = "";
    const sessionsToShow = [...lastKnown.values()]
      .filter((s) => showArchived || !s.archived)
      .sort((a, b) => {
        const rankDiff = activityRank(a) - activityRank(b);
        return rankDiff !== 0 ? rankDiff : a.created_at - b.created_at;
      });
    for (const session of sessionsToShow) list.appendChild(renderCard(session));
  }

  showArchivedCheckbox.addEventListener("change", () => {
    showArchived = showArchivedCheckbox.checked;
    renderList();
  });

  function loadSessions() {
    fetch("/sessions")
      .then((r) => r.json())
      .then((allSessions) => {
        for (const session of allSessions) lastKnown.set(session.id, session);
        renderList();
      });
  }

  loadSessions();

  const ws = new WebSocket(`ws://${location.host}/ws/sessions`);
  ws.onmessage = (msg) => {
    const event = JSON.parse(msg.data);
    if (event.session) upsert(event.session);
  };

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    fetch("/sessions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: nameInput.value.trim(),
        product: productSelect.value,
        initiative_id: initiativeSelect.value,
        model: modelSelect.value,
        mode: modeSelect.value,
      }),
    })
      .then((r) => r.json())
      .then((session) => {
        location.href = `/chat/${session.id}`;
      })
      .catch(() => { submitBtn.disabled = false; });
  });

  // Identity, the roster link and sign out now live in the shared nav, on every page.
  // What stays page-specific is the create form, which only some roles may use.
  // Reusing PMNav.auth rather than re-fetching keeps this to one /auth/me per load.
  PMNav.auth.then((info) => {
    if (!info || !info.enterprise || !info.user) return;
    // Hiding a control this role can't use is cosmetic only - the server enforces every
    // capability independently, so a hidden form is not the protection.
    if (!(info.capabilities || []).includes("manage_session_lifecycle")) {
      const newForm = document.getElementById("new-form");
      if (newForm) newForm.style.display = "none";
    }
  });
</script>
</body>
</html>
