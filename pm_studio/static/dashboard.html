<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PM Studio — Dev Lifecycle</title>
<link rel="stylesheet" href="/static/nav.css" />
<script src="/static/nav.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink-primary: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --border: rgba(11, 11, 11, 0.10);
    --status-running: #2a78d6;
    --status-done: #0ca30c;
    --status-error: #d03b3b;
    --status-auto: #b8860b;
    --accent: #2a78d6;
    --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19;
      --page: #0d0d0d;
      --ink-primary: #ffffff;
      --ink-secondary: #c3c2b7;
      --ink-muted: #898781;
      --border: rgba(255, 255, 255, 0.10);
      --status-running: #3987e5;
      --status-done: #0ca30c;
      --status-error: #e66767;
      --status-auto: #d4a72c;
      --accent: #3987e5;
      --accent-fg: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page);
    color: var(--ink-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header h1 { font-size: 1.05em; margin: 0; }
  header p { margin: 0; color: var(--ink-muted); font-size: 0.85em; }
  #empty {
    padding: 48px 24px;
    text-align: center;
    color: var(--ink-muted);
  }
  #list, #session-banner-wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 24px;
  }
  #list {
    padding-top: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85em;
    font-weight: 600;
  }
  .badge .dot { font-size: 1.1em; line-height: 1; }
  .badge.running { color: var(--status-running); }
  .badge.done, .badge.clean, .badge.active { color: var(--status-done); }
  .badge.error, .badge.failed, .badge.conflict { color: var(--status-error); }
  .badge.auto_resolved, .badge.merging { color: var(--status-auto); }
  .badge.running .dot { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  .meta {
    font-size: 0.8em;
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .description {
    margin-top: 8px;
    color: var(--ink-primary);
    line-height: 1.4;
  }
  details { margin-top: 10px; }
  summary {
    cursor: pointer;
    color: var(--ink-secondary);
    font-size: 0.85em;
    user-select: none;
  }
  pre {
    margin: 8px 0 0;
    padding: 10px 12px;
    background: var(--page);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.82em;
    white-space: pre-wrap;
    word-wrap: break-word;
    color: var(--ink-secondary);
    max-height: 300px;
    overflow-y: auto;
  }
  #session-banner {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  #session-banner .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  #session-banner .name { font-weight: 600; }
  #session-banner .branch {
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.82em;
    color: var(--ink-muted);
  }
  #session-banner .note { margin-top: 8px; font-size: 0.85em; color: var(--ink-secondary); }
  button.merge-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-fg);
    font: inherit;
    font-size: 0.85em;
    font-weight: 600;
    cursor: pointer;
  }
  button.merge-btn:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<!-- The breadcrumb (Sessions › this session) and the Chat / Dev lifecycle sub-tabs are
     rendered by the shared nav, which resolves the session title for the trail. -->
<div id="pm-nav" data-page="dashboard"></div>
<header>
  <h1>Dev Lifecycle</h1>
  <p>Every dev task this session has dispatched, with status, duration and result.</p>
</header>
<div id="session-banner-wrap"><div id="session-banner"></div></div>
<div id="empty">No dev tasks yet.</div>
<div id="list"></div>
<script>
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  const banner = document.getElementById("session-banner");
  const cards = new Map(); // task id -> card element

  // URL is /dashboard/{session_id}
  const sessionId = location.pathname.split("/").filter(Boolean).pop();

  const BADGE = {
    running: { dot: "●", label: "Running" },
    done: { dot: "✓", label: "Done" },
    error: { dot: "✗", label: "Error" },
  };

  const SESSION_BADGE = {
    active: { dot: "●", label: "Active" },
    merging: { dot: "●", label: "Merging…" },
    merged: { dot: "✓", label: "Merged" },
    conflict: { dot: "✗", label: "Conflict" },
    archived: { dot: "○", label: "Archived" },
  };

  const OUTCOME_BADGE = {
    clean: { dot: "✓", label: "Clean merge" },
    auto_resolved: { dot: "⚠", label: "Auto-resolved merge" },
    failed: { dot: "✗", label: "Merge failed" },
  };

  function relativeTime(seconds) {
    const diff = Date.now() / 1000 - seconds;
    if (diff < 60) return "just now";
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    return `${Math.floor(diff / 86400)}d ago`;
  }

  function duration(startedAt, finishedAt) {
    const secs = Math.max(0, Math.round(finishedAt - startedAt));
    if (secs < 60) return `${secs}s`;
    return `${Math.floor(secs / 60)}m ${secs % 60}s`;
  }

  function renderCard(task) {
    const badge = BADGE[task.status] ?? BADGE.running;
    const card = document.createElement("div");
    card.className = "card";

    const metaText = task.finished_at
      ? `${relativeTime(task.started_at)} &middot; took ${duration(task.started_at, task.finished_at)}`
      : relativeTime(task.started_at);

    card.innerHTML = `
      <div class="card-top">
        <span class="badge ${task.status}"><span class="dot">${badge.dot}</span>${badge.label}</span>
        <span class="meta">${metaText}</span>
      </div>
      <div class="description"></div>
      ${task.result ? `<details><summary>Result</summary><pre></pre></details>` : ""}
    `;
    card.querySelector(".description").textContent = task.description;
    if (task.result) {
      card.querySelector("pre").textContent = task.result;
    }
    return card;
  }

  function upsert(task) {
    empty.style.display = "none";
    const rendered = renderCard(task);
    const existing = cards.get(task.id);
    if (existing) {
      existing.replaceWith(rendered);
    } else {
      list.prepend(rendered);
    }
    cards.set(task.id, rendered);
  }

  function renderBanner(session) {
    const statusBadge = SESSION_BADGE[session.status] ?? SESSION_BADGE.active;
    const canMerge = !session.is_default && (session.status === "active" || session.status === "conflict");
    const canCleanup = !session.is_default && session.status === "merged";

    let resultHtml = "";
    if (session.merge_result) {
      const r = session.merge_result;
      const outcomeBadge = OUTCOME_BADGE[r.outcome] ?? OUTCOME_BADGE.failed;
      resultHtml = `
        <div class="note">
          <span class="badge ${r.outcome}"><span class="dot">${outcomeBadge.dot}</span>${outcomeBadge.label}</span>
          ${r.message ? `<details><summary>Details</summary><pre></pre></details>` : ""}
        </div>
      `;
    }

    banner.innerHTML = `
      <div class="row">
        <div>
          <span class="name"></span> &middot; <span class="branch"></span>
          <div><span class="badge ${session.status}"><span class="dot">${statusBadge.dot}</span>${statusBadge.label}</span></div>
        </div>
        <div>
          ${canMerge ? `<button class="merge-btn" id="merge-btn">Merge to main</button>` : ""}
          ${canCleanup ? `<button class="merge-btn" id="cleanup-btn">Clean up worktree</button>` : ""}
        </div>
      </div>
      ${resultHtml}
    `;
    banner.querySelector(".name").textContent = session.name;
    banner.querySelector(".branch").textContent = session.branch;
    if (session.merge_result && session.merge_result.message) {
      banner.querySelector("pre").textContent = session.merge_result.message;
    }

    const mergeBtn = document.getElementById("merge-btn");
    if (mergeBtn) {
      mergeBtn.addEventListener("click", () => {
        mergeBtn.disabled = true;
        mergeBtn.textContent = "Merging…";
        fetch(`/sessions/${sessionId}/merge`, { method: "POST" })
          .then((r) => r.json())
          .then(renderBanner)
          .catch(() => { mergeBtn.disabled = false; mergeBtn.textContent = "Merge to main"; });
      });
    }
    const cleanupBtn = document.getElementById("cleanup-btn");
    if (cleanupBtn) {
      cleanupBtn.addEventListener("click", () => {
        cleanupBtn.disabled = true;
        fetch(`/sessions/${sessionId}/cleanup`, { method: "POST" })
          .then((r) => r.json())
          .then(renderBanner);
      });
    }
  }

  function loadSession() {
    fetch(`/sessions/${sessionId}`)
      .then((r) => r.json())
      .then(renderBanner)
      .catch(() => {});
  }

  loadSession();

  fetch(`/tasks/${sessionId}`)
    .then((r) => r.json())
    .then((tasks) => {
      if (tasks.length === 0) return;
      empty.style.display = "none";
      // upsert() prepends new cards, so feed oldest-first to end up newest-on-top
      for (const task of tasks.slice().reverse()) upsert(task);
    });

  const tasksWs = new WebSocket(`ws://${location.host}/ws/tasks/${sessionId}`);
  tasksWs.onmessage = (msg) => {
    const { task } = JSON.parse(msg.data);
    upsert(task);
  };

  const sessionsWs = new WebSocket(`ws://${location.host}/ws/sessions`);
  sessionsWs.onmessage = (msg) => {
    const event = JSON.parse(msg.data);
    if (event.session && event.session.id === sessionId) renderBanner(event.session);
  };
</script>
</body>
</html>
